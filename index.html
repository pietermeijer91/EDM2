<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDSN Delivery Model</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0072BC}a:hover{color:#1B2A5C}
.hit{position:absolute;background:none;border:0;padding:6px;margin:0;cursor:pointer;font:inherit;color:inherit;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;line-height:1.2;transition:background .15s}
.shift button,.shift a{pointer-events:auto}
.hit:hover{background:rgba(0,114,188,.10)}
@keyframes beltmove{from{background-position:0 0,0 0}to{background-position:40px 0,0 0}}
@keyframes rollers{from{background-position:0 0}to{background-position:20px 0}}
@keyframes beltitem{0%{transform:translateX(0);opacity:0}5%{opacity:1}88%{opacity:1}100%{transform:translateX(960px);opacity:0}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(-110px);opacity:0}}
.belt{animation:beltmove .72s linear infinite}
.rollers{animation:rollers .36s linear infinite}
.belt-item{position:absolute;pointer-events:none;white-space:nowrap;animation:beltitem 18s linear infinite}
.rise{pointer-events:none;animation:rise 2.4s ease-in infinite}
@keyframes vptFlow{0%{transform:translate(0px,0px);opacity:0}2%{opacity:1}2.5%{transform:translate(0px,0px)}8.5%{transform:translate(0px,0px)}12.5%{transform:translate(140px,0px)}21.0%{transform:translate(140px,0px)}25.0%{transform:translate(280px,0px)}33.5%{transform:translate(280px,0px)}37.5%{transform:translate(420px,0px)}46.0%{transform:translate(420px,0px)}50.0%{transform:translate(560px,0px)}58.5%{transform:translate(560px,0px)}62.5%{transform:translate(700px,0px)}71.0%{transform:translate(700px,0px)}75.0%{transform:translate(840px,0px)}83.5%{transform:translate(840px,0px)}87.5%{transform:translate(980px,0px)}96.0%{transform:translate(980px,0px)}96%{transform:translate(980px,0px);opacity:1}100%{transform:translate(980px,0px);opacity:0}}
@keyframes vptDone{0%,87%{opacity:0;transform:scale(.3)}90%{opacity:1;transform:scale(1.2)}93%,100%{opacity:1;transform:scale(1)}}
@keyframes vptWip{0%,100%{opacity:.55}50%{opacity:1}}
.vpt-card{position:absolute;animation:vptFlow 16s linear infinite}
.vpt-done{animation:vptDone 16s linear infinite}
.vpt-wip{animation:vptWip 1.6s ease-in-out infinite}
@keyframes eeTok{0%{left:calc(8.33% - 52px);opacity:0}2%{opacity:1}2.00%{left:calc(8.333% - 52px)}10.00%{left:calc(8.333% - 52px)}16.67%{left:calc(25.000% - 52px)}26.67%{left:calc(25.000% - 52px)}33.33%{left:calc(41.667% - 52px)}43.33%{left:calc(41.667% - 52px)}50.00%{left:calc(58.333% - 52px)}60.00%{left:calc(58.333% - 52px)}66.67%{left:calc(75.000% - 52px)}76.67%{left:calc(75.000% - 52px)}83.33%{left:calc(91.667% - 52px)}93.33%{left:calc(91.667% - 52px)}97%{left:calc(91.667% - 52px);opacity:1}100%{left:calc(91.667% - 52px);opacity:0}}
@keyframes eeHi{0%,16%{border-color:var(--hi);transform:translateY(-4px)}17%,100%{border-color:#D5DBE5;transform:translateY(0)}}
.ee-tok{position:absolute;animation:eeTok 12s linear infinite}
.ee-hi{animation:eeHi 12s linear infinite}
@keyframes laceTrain{from{transform:translateX(-105%)}to{transform:translateX(100vw)}}
@keyframes laceCard{0%,30%{opacity:0;transform:translate(-50%,20px)}45%,100%{opacity:1;transform:translate(-50%,0)}}
@keyframes lacePuff{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-30px,-40px) scale(1.6)}}
@keyframes laceGlow{0%,100%{opacity:.35}50%{opacity:.6}}
.lace-train{animation:laceTrain 8s cubic-bezier(.4,0,.6,1) 1 forwards}
.lace-card{animation:laceCard 4s ease-out 1 forwards}
@keyframes laceFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.lace-float{animation:laceFloat 1.8s ease-in-out infinite}
.lace-egg{animation:laceGlow 3s ease-in-out infinite}
.lace-egg:hover{opacity:1 !important;animation:none}
@keyframes bvPulse{0%{left:12%;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:calc(88% - 16px);opacity:0}}
.bv-pulse{animation:bvPulse 4s ease-in-out infinite}
@keyframes spMove{0%{transform:translateX(0);opacity:0}6%{opacity:1}74%{transform:translateX(400px);opacity:1}84%{transform:translateX(440px);opacity:0}100%{transform:translateX(440px);opacity:0}}
@keyframes spBadge{0%,30%{opacity:0;transform:scale(.3)}36%{opacity:1;transform:scale(1.25)}42%,100%{opacity:1;transform:scale(1)}}
@keyframes spFill{0%{transform:scaleX(.04)}85%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes spPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes spHi{0%,24%{opacity:1;transform:translateY(-3px)}25%,100%{opacity:.35;transform:translateY(0)}}
@keyframes spCheck{0%,78%{opacity:0;transform:translateY(8px)}86%,100%{opacity:1;transform:translateY(0)}}
@keyframes spGate{0%,100%{opacity:.45}50%{opacity:1}}
.sp-move{position:absolute;animation:spMove 6s linear infinite}
.sp-badge{animation:spBadge 6s linear infinite}
.sp-fill{transform-origin:left center;animation:spFill 12s ease-out infinite}
.sp-pulse{animation:spPulse 2s ease-in-out infinite}
.sp-hi{animation:spHi 12s linear infinite}
.sp-check{animation:spCheck 12s ease-out infinite}
.sp-gate{animation:spGate 2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.bv-pulse,.ee-tok,.ee-hi,.vpt-card,.vpt-done,.vpt-wip,.belt,.rollers,.belt-item,.rise,.sp-move,.sp-badge,.sp-fill,.sp-pulse,.sp-hi,.sp-check,.sp-gate{animation-play-state:paused !important}}
.hit:focus-visible{outline:2px solid #0072BC;outline-offset:2px}
</style>

<style>html,body{margin:0;background:#FFFFFF}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="width: 100%; min-height: 100vh; background: #FFFFFF; overflow-x: hidden; font-family: Poppins, 'Segoe UI', sans-serif; color: #1B2A5C">
<div style="width: 100%; box-sizing: border-box; background: #FFFFFF; zoom: {{uiZoom}}; font-family: Poppins, 'Segoe UI', sans-serif; color: #1B2A5C">
  <!-- ===== Website header ===== -->
  <header style="height: 76px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E1E6EE; box-sizing: border-box">
    <button style="display: flex; align-items: center; gap: 14px; background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; color: #1B2A5C" onClick="{{close}}" aria-label="EDSN Delivery Model – home">
      <span style="display: grid; grid-template-columns: repeat(2, 14px); gap: 3px">
        <span style="height: 14px; border-radius: 4px 1px 1px 1px; background: #0072BC"></span><span style="height: 14px; border-radius: 1px 4px 1px 1px; background: #00A6D6"></span>
        <span style="height: 14px; border-radius: 1px 1px 1px 4px; background: #F39200"></span><span style="height: 14px; border-radius: 1px 1px 4px 1px; background: #95C11F"></span>
      </span>
      <span style="font-size: 24px; font-weight: 700; letter-spacing: 1px">EDSN</span>
      <span style="width: 1px; height: 26px; background: #D5DBE5"></span>
      <span style="font-size: 17px; font-weight: 500; color: #3E4A63">Delivery Model</span>
    </button>
    <nav style="display: flex; align-items: center; gap: 4px" aria-label="Hoofdmenu">
      <button style="min-height: 44px; padding: 0 16px; background: none; border: 0; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 600; color: #1B2A5C" onClick="{{close}}">Big Picture</button>
      <button style="min-height: 44px; padding: 0 16px; background: none; border: 0; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 500; color: #3E4A63" onClick="{{open.t4k}}">Tactisch vierkant</button>
      <button style="min-height: 44px; padding: 0 16px; background: none; border: 0; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 500; color: #3E4A63" onClick="{{open.vpt}}">Werkwijze</button>
      <button style="min-height: 44px; padding: 0 16px; background: none; border: 0; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 500; color: #3E4A63" onClick="{{open.governance}}">AI Governance</button>
      <button style="min-height: 44px; padding: 0 16px; background: none; border: 0; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 500; color: #3E4A63" onClick="{{open.f5}}">LACE</button>
      <button style="margin-left: 8px; min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: 1.5px solid #D5DBE5; border-radius: 22px; background: #FFFFFF; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 600; color: #1B2A5C" onClick="{{openConcepts}}">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h9l5 5v13H5zM14 3v5h5M8 13h8M8 17h5" fill="none" stroke="#1B2A5C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
        Concepten
        <span style="display: flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: {{orange}}; color: #2B1A00; font-size: 12px; font-weight: 800">{{wow.open}}</span>
      </button>
      <button onClick="{{openArtie}}" style="margin-left: 12px; border: 0; cursor: pointer; font-family: inherit; min-height: 44px; padding: 0 20px; display: flex; align-items: center; gap: 10px; border-radius: 22px; background: #F39200; color: #2B1A00; font-size: 15px; font-weight: 700; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="#2B1A00" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="10.5" r="1.3" fill="#2B1A00"/><circle cx="15" cy="10.5" r="1.3" fill="#2B1A00"/></svg>
        Vraag het ARTie
      </button>
      <button style="margin-left: 10px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1.5px solid #D5DBE5; background: #FFFFFF; cursor: pointer; padding: 0" onClick="{{toggleDark}}" aria-pressed="{{isDark}}" aria-label="{{darkLabel}}" title="{{darkLabel}}">
        <sc-if value="{{notDark}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="#1B2A5C"/></svg></sc-if>
        <sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="#F39200"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="#F39200" stroke-width="2" stroke-linecap="round"/></svg></sc-if>
      </button>
    </nav>
  </header>

  <!-- Welkomstdeel: alleen op de startpagina, niet bij verdiepende artikelen -->
  <sc-if value="{{noSel}}" hint-placeholder-val="{{ true }}">
  <!-- ===== Intro ===== -->
  <section style="padding: 44px 40px 32px; display: flex; flex-wrap: wrap; gap: 32px 48px; align-items: flex-start">
    <div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-size: 52px; line-height: 1.1; font-weight: 700; letter-spacing: -1px; color: #1B2A5C">Welkom bij het EDSN Delivery Model</h1>
      <p style="margin: 0; font-size: 19px; line-height: 1.65; color: #2E3A55">Hoe leveren we bij EDSN samen waarde voor de energieketen? Het Delivery Model laat het zien: van strategie en portfolio tot de teams die elke dag bouwen aan betrouwbare ketenvoorzieningen. <strong>Basis EDSN</strong> is onze Lean-Agile manier van werken, gebaseerd op SAFe. <strong>AI-Native EDSN</strong> bouwt daarop voort en laat zien hoe mensen en AI samen sneller, slimmer en verantwoord meer waarde creëren.</p>
      <div style="position: relative; max-width: 820px; margin-top: 6px">
        <form onSubmit="{{ask.submit}}" role="search" style="display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 20px; border: 2px solid #1B2A5C; border-radius: 32px; background: #FFFFFF">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#1B2A5C" stroke-width="2.4"/><path d="M15.5 15.5L21 21" stroke="#1B2A5C" stroke-width="2.4" stroke-linecap="round"/></svg>
          <input id="edm-ask" type="text" autocomplete="off" spellcheck="false" aria-label="Stel je vraag over het Delivery Model" aria-controls="edm-ask-res" placeholder="Stel je vraag, bijv. ‘Wat doet een RTE?’" onInput="{{ask.input}}" onFocus="{{ask.input}}" onKeyDown="{{ask.key}}" style="flex: 1; min-width: 0; min-height: 46px; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 17px; color: #1B2A5C">
          <button type="submit" style="flex-shrink: 0; min-height: 46px; padding: 0 20px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 24px; background: #F39200; color: #2B1A00; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="#2B1A00" stroke-width="2" stroke-linejoin="round"/></svg>
            Vraag het ARTie
          </button>
        </form>
        <div id="edm-ask-res" role="listbox" aria-label="Antwoorden uit het Delivery Model" onClick="{{ask.pick}}" style="display: none; position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 60; max-height: 460px; overflow: auto; padding: 8px; border-radius: 18px; border: 1.5px solid #D5DBE5; background: #FFFFFF; box-shadow: 0 14px 36px rgba(27, 42, 92, 0.18)"></div>
      </div>
      <p style="margin: 0; font-size: 15px; font-weight: 600; color: #0062A3">Of klik op een onderdeel in de Big Picture voor uitleg, rollen en verantwoordelijkheden.</p>
    </div>
    <div style="width: 340px; flex-shrink: 0; padding: 24px 26px; border-radius: 14px; background: #1B2A5C; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
      <span style="display: flex; align-items: center; gap: 12px">
        <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #F39200">
          <svg width="24" height="24" viewBox="0 0 22 22" aria-hidden="true"><rect x="3" y="6" width="16" height="12" rx="3" fill="#2B1A00"/><circle cx="8" cy="12" r="1.8" fill="#F39200"/><circle cx="14" cy="12" r="1.8" fill="#F39200"/><path d="M11 6V2" stroke="#2B1A00" stroke-width="2"/><circle cx="11" cy="2" r="1.5" fill="#2B1A00"/></svg>
        </span>
        <span style="font-size: 20px; font-weight: 700">Vraag het ARTie</span>
      </span>
      <span style="font-size: 15px; line-height: 1.55; color: #DCE3EF">Vragen over rollen, events of de werkwijze? ARTie, onze chatbot, helpt je direct op weg.</span>
      <button style="align-self: flex-start; min-height: 44px; padding: 0 20px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 22px; background: #FFFFFF; color: #1B2A5C; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700" onClick="{{openArtie}}">
        Start een gesprek
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="#1B2A5C" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </section>

  </sc-if>
</div>

<sc-if value="{{noSel}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; width: 100%; height: {{bpH}}px; overflow: hidden">
<div style="position: absolute; left: 50%; top: 0; margin-left: -800px; width: 1600px; height: {{rootH}}px; transform: scale({{scale}}); transform-origin: 50% 0; background: #FFFFFF; font-family: Poppins, 'Segoe UI', sans-serif; color: #1B2A5C; overflow: hidden">

  <!-- Toggle -->
  <div style="position: absolute; left: 40px; top: 26px; display: flex; gap: 4px; padding: 5px; background: #EEF2F7; border: 1px solid #D5DBE5; border-radius: 40px">
    <button style="{{coreBtn}}" onClick="{{setCore}}" aria-pressed="{{coreOn}}">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 2 6l8 4 8-4zM2 10l8 4 8-4M2 14l8 4 8-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
      Basis EDSN
    </button>
    <button style="{{aiBtn}}" onClick="{{setAi}}" aria-pressed="{{ai}}">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 2l1.6 4.4L14 8l-4.4 1.6L8 14l-1.6-4.4L2 8l4.4-1.6zM15 12l.8 2.2L18 15l-2.2.8L15 18l-.8-2.2L12 15l2.2-.8z" fill="currentColor"></path></svg>
      AI-Native EDSN
    </button>
  </div>

  <!-- Title -->
  <div style="position: absolute; left: 560px; right: 40px; top: 54px; height: 6px; background: {{navy}}; border-radius: 3px"></div>
  <div style="position: absolute; right: 120px; top: 30px; padding: 0 20px; background: #FFFFFF; display: flex; align-items: center; gap: 12px">
    <sc-if value="{{ai}}" hint-placeholder-val="{{ true }}">
      <svg width="34" height="34" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 2l1.6 4.4L14 8l-4.4 1.6L8 14l-1.6-4.4L2 8l4.4-1.6zM15 12l.8 2.2L18 15l-2.2.8L15 18l-.8-2.2L12 15l2.2-.8z" fill="{{orange}}"></path></svg>
    </sc-if>
    <span style="font-size: 40px; font-weight: 700; letter-spacing: -0.5px">{{t.title}}</span>
  </div>

  <!-- Frame -->
  <div style="position: absolute; left: 40px; top: 110px; width: 1520px; height: {{frameH}}px; border: 2px solid #D5DBE5; border-radius: 14px; box-sizing: border-box"></div>
  <!-- Portfolio-niveau: uitklapbaar -->
  <sc-if value="{{pfOpen}}" hint-placeholder-val="{{ false }}">
  <!-- Org column divider -->
  <div style="position: absolute; left: 222px; top: 112px; width: 2px; height: 358px; background: #D5DBE5"></div>
  <!-- Organization -->
  <button class="hit" style="left: 56px; top: 130px; width: 150px" onClick="{{open.org}}">
    <span style="font-size: 15px; font-weight: 600; color: #5A6478">{{t.org}}</span>
    <svg width="110" height="170" viewBox="0 0 110 170" aria-hidden="true">
      <rect x="18" y="20" width="34" height="120" fill="{{cyan}}"></rect>
      <rect x="40" y="40" width="52" height="100" fill="{{navy}}"></rect>
      <g stroke="#FFFFFF" stroke-width="3"><path d="M50 56h32M50 70h32M50 84h32M50 98h32M50 112h32M50 126h32"></path></g>
      <path d="M6 140h98" stroke="{{blue}}" stroke-width="3"></path>
      <g stroke="{{blue}}" stroke-width="2" fill="none"><path d="M16 140v18M28 140v26M40 140v14M52 140v22M64 140v12M76 140v24M88 140v16M98 140v20"></path></g>
      <g fill="{{blue}}"><circle cx="16" cy="159" r="2.5"></circle><circle cx="28" cy="167" r="2.5"></circle><circle cx="40" cy="155" r="2.5"></circle><circle cx="52" cy="163" r="2.5"></circle><circle cx="64" cy="153" r="2.5"></circle><circle cx="76" cy="165" r="2.5"></circle><circle cx="88" cy="157" r="2.5"></circle><circle cx="98" cy="161" r="2.5"></circle></g>
    </svg>
  </button>

  <!-- Portfolio-niveau: grijs en niet klikbaar -->
  <div style="position: absolute; inset: 0; filter: grayscale(1); opacity: .45; pointer-events: none" aria-hidden="true">
    <div style="position: absolute; left: 405px; top: 189px; width: 170px; height: 150px; border-left: 2px solid #B8C2D1; border-right: 2px solid #B8C2D1; border-radius: 80px / 75px"></div>
  <!-- Portfolio tab -->
  <button disabled tabindex="-1" class="hit" style="left: 800px; top: 112px; width: 150px; background: {{tintB}}; border-radius: 0 0 12px 12px; color: #2C5F7A; font-size: 15px; font-weight: 600">Portfolio</button>

  <!-- Portfolio Leadership -->
  <button disabled tabindex="-1" class="hit" style="left: 250px; top: 170px; width: 140px">
    <span style="display: flex; gap: 2px">
      <svg width="26" height="32" viewBox="0 0 22 26" aria-hidden="true"><circle cx="11" cy="7" r="5" fill="{{navy}}"></circle><path d="M1 26v-5a7 7 0 0 1 7-7h6a7 7 0 0 1 7 7v5z" fill="{{navy}}"></path></svg>
      <svg width="26" height="32" viewBox="0 0 22 26" aria-hidden="true"><circle cx="11" cy="7" r="5" fill="{{blue}}"></circle><path d="M1 26v-5a7 7 0 0 1 7-7h6a7 7 0 0 1 7 7v5z" fill="{{blue}}"></path></svg>
      <svg width="26" height="32" viewBox="0 0 22 26" aria-hidden="true"><circle cx="11" cy="7" r="5" fill="{{navy}}"></circle><path d="M1 26v-5a7 7 0 0 1 7-7h6a7 7 0 0 1 7 7v5z" fill="{{navy}}"></path></svg>
    </span>
    <span style="font-size: 15px; font-weight: 600">Portfolio<br>Leadership</span>
  </button>

  <!-- Outcomes + Investment Strategy -->
