                        <sc-if value="{{st.isStep}}" hint-placeholder-val="{{ true }}">
                          <div style="padding: 18px 16px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #D5DBE5; display: flex; flex-direction: column; gap: 8px">
                            <span style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: {{st.color}}; color: {{st.fg}}; font-size: 16px; font-weight: 700">{{st.n}}</span>
                            <span style="font-size: 16px; font-weight: 700; line-height: 1.3; color: #1B2A5C">{{st.title}}</span>
                            <span style="font-size: 14px; line-height: 1.5; color: #3E4A63">{{st.text}}</span>
                          </div>
                        </sc-if>
                        <sc-if value="{{st.isArrow}}" hint-placeholder-val="{{ false }}">
                          <span style="display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3l7 7-7 7" fill="none" stroke="{{blue}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                        </sc-if>
                      </sc-for>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 12px">
                      <span style="font-size: 16px; font-weight: 700; color: #1B2A5C">Eén schaal voor alle teams in de ART</span>
                      <div style="display: grid; grid-template-columns: 90px repeat(6, minmax(0, 1fr)); gap: 10px; align-items: end">
                        <span></span>
                        <sc-for list="{{sp.scale}}" as="c" hint-placeholder-count="6">
                          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
                            <span style="{{c.card}}">{{c.v}}</span>
                            <span style="font-size: 12px; font-weight: 600; color: #3E4A63; min-height: 16px">{{c.cap}}</span>
                          </div>
                        </sc-for>
                      </div>
                      <sc-for list="{{sp.teams}}" as="tm" hint-placeholder-count="3">
                        <div style="display: grid; grid-template-columns: 90px repeat(6, minmax(0, 1fr)); gap: 10px; align-items: center; padding: 8px 0; border-top: 1px dashed #C9D1DD">
                          <span style="font-size: 14px; font-weight: 700; color: #1B2A5C">{{tm.name}}</span>
                          <sc-for list="{{tm.cells}}" as="cl" hint-placeholder-count="6">
                            <span style="display: flex; justify-content: center; gap: 4px; min-height: 22px">
                              <sc-for list="{{cl.items}}" as="it" hint-placeholder-count="1">
                                <span style="width: 26px; height: 18px; border-radius: 3px; background: {{tm.color}}; box-shadow: 0 3px 0 rgba(0,0,0,.2)"></span>
                              </sc-for>
                            </span>
                          </sc-for>
                        </div>
                      </sc-for>
                      <span style="font-size: 14px; line-height: 1.5; color: #3E4A63">Elk blokje is een story. Teams schatten zelf, maar altijd ten opzichte van dezelfde referentiestory (1 punt). Daardoor is velocity over teams heen te begrijpen en betrouwbaar te plannen.</span>
                    </div>
                  </div>
                </section>

                <section id="uitgangspunten" style="display: flex; flex-direction: column; gap: 16px">
                  <h2 style="margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; color: #1B2A5C">Vast te stellen uitgangspunten bij velocity</h2>
                  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
                    <sc-for list="{{sp.principles}}" as="pr" hint-placeholder-count="10">
                      <div style="padding: 18px 20px; border: 1.5px solid #D5DBE5; border-radius: 12px; display: flex; gap: 14px; align-items: flex-start">
                        <span style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: {{pr.color}}; color: {{pr.fg}}; font-size: 15px; font-weight: 700">{{pr.n}}</span>
                        <span style="display: flex; flex-direction: column; gap: 4px">
                          <span style="font-size: 16px; font-weight: 700; color: #1B2A5C">{{pr.title}}</span>
                          <span style="font-size: 14px; line-height: 1.55; color: #3E4A63">{{pr.text}}</span>
                        </span>
                      </div>
                    </sc-for>
                  </div>
                </section>

                <section id="alternatieven" style="display: flex; flex-direction: column; gap: 16px">
                  <h2 style="margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; color: #1B2A5C">Alternatieven afgewogen</h2>
                  <div style="display: flex; flex-direction: column; gap: 8px">
                    <div style="display: grid; grid-template-columns: 170px minmax(0, 1.2fr) minmax(0, 1.2fr) 130px minmax(0, 1.3fr); gap: 16px; padding: 12px 18px; background: #EEF2F7; border-radius: 10px; font-size: 14px; font-weight: 700; color: #1B2A5C">
                      <span>Methode</span><span>Geschikt voor</span><span>Forecasting</span><span>Jira Align</span><span>Conclusie</span>
                    </div>
                    <sc-for list="{{sp.alts}}" as="al" hint-placeholder-count="3">
                      <div style="{{al.row}}">
                        <span style="font-size: 15px; font-weight: 700; color: #1B2A5C">{{al.name}}</span>
                        <span style="font-size: 14px; line-height: 1.5; color: #2E3A55">{{al.use}}</span>
                        <span style="font-size: 14px; line-height: 1.5; color: #2E3A55">{{al.fc}}</span>
                        <span style="{{al.jaStyle}}">{{al.ja}}</span>
                        <span style="font-size: 14px; line-height: 1.5; color: #2E3A55">{{al.concl}}</span>
                      </div>
                    </sc-for>
                  </div>
                </section>
              </sc-if>

              <sc-if value="{{page.hasCmp}}" hint-placeholder-val="{{ false }}">
                <section id="vergelijking" style="display: flex; flex-direction: column; gap: 14px">
                  <h2 style="margin: 0; font-size: 28px; line-height: 1.25; font-weight: 700; color: #1B2A5C">Output versus outcome</h2>
                  <div style="display: flex; flex-direction: column; gap: 8px">
                    <div style="display: grid; grid-template-columns: 170px minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding: 12px 18px; background: #EEF2F7; border-radius: 10px; font-size: 14px; font-weight: 700; color: #1B2A5C">
                      <span></span><span>Output-gedreven</span><span>Outcome-gedreven</span>
                    </div>
                    <sc-for list="{{page.cmp}}" as="r" hint-placeholder-count="4">
                      <div style="display: grid; grid-template-columns: 170px minmax(0, 1fr) minmax(0, 1fr); gap: 20px; padding: 14px 18px; border: 1px solid #D5DBE5; border-radius: 10px; align-items: start">
                        <span style="font-size: 15px; font-weight: 700; color: #1B2A5C">{{r.a}}</span>
                        <span style="font-size: 15px; line-height: 1.55; color: #5A6478">{{r.b}}</span>
                        <span style="font-size: 15px; line-height: 1.55; font-weight: 600; color: #1B2A5C">{{r.c}}</span>
                      </div>
                    </sc-for>
                  </div>
                </section>
              </sc-if>
              <sc-if value="{{page.hasEdsn}}" hint-placeholder-val="{{ true }}">
                <section id="bij-edsn" style="padding: 24px 28px; border-radius: 14px; background: {{navy}}; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
                  <h2 style="margin: 0; font-size: 22px; font-weight: 700">Bij EDSN</h2>
                  <p style="margin: 0; font-size: 17px; line-height: 1.7; color: #E6ECF5">{{page.edsn}}</p>
                </section>
              </sc-if>
            </div>

            <div style="flex: 1 1 280px; max-width: 380px; display: flex; flex-direction: column; gap: 20px">
              <nav style="padding: 22px 24px; border: 1px solid #D5DBE5; border-radius: 14px; display: flex; flex-direction: column; gap: 10px" aria-label="In dit artikel">
                <span style="font-size: 15px; font-weight: 700">In dit artikel</span>
                <sc-for list="{{page.toc}}" as="s" hint-placeholder-count="4">
                  <a href="#{{s.id}}" style="font-size: 15px; line-height: 1.4">{{s.h}}</a>
                </sc-for>
              </nav>
              <div style="padding: 22px 24px; background: #FFF4E3; border-radius: 14px; display: flex; flex-direction: column; gap: 12px">
                <span style="font-size: 15px; font-weight: 700">Kernpunten</span>
                <sc-for list="{{page.keys}}" as="k" hint-placeholder-count="3">
                  <span style="display: flex; gap: 10px; font-size: 15px; line-height: 1.5; color: #2E3A55">
                    <svg style="flex-shrink: 0; margin-top: 3px" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="{{orange}}"/><path d="M4.8 8.2 7 10.4l4.2-4.6" fill="none" stroke="#FFFFFF" stroke-width="1.8"/></svg>
                    {{k.text}}
                  </span>
                </sc-for>
              </div>
              <div style="padding: 22px 24px; border: 1px solid #D5DBE5; border-radius: 14px; display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 15px; font-weight: 700; margin-bottom: 4px">Gerelateerd</span>
                <sc-for list="{{page.related}}" as="r" hint-placeholder-count="3">
                  <button style="min-height: 44px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #F1F4F8; border: 0; border-radius: 10px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 500; color: #1B2A5C; text-align: left" onClick="{{r.pick}}">
                    {{r.title}}
                    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="#0062A3" stroke-width="2" stroke-linecap="round"/></svg>
                  </button>
                </sc-for>
              </div>
              <span style="font-size: 13px; color: #5A6478">Laatst bijgewerkt: {{page.updated}} · CIO Office</span>
            </div>
          </div>

          <!-- ===== AI-Native ART ===== -->
          <sc-if value="{{page.isAIART}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 40px">
            <div style="padding: 18px 22px; border-radius: 14px; background: {{navy}}; color: #FFFFFF; display: flex; align-items: center; gap: 16px">
              <svg width="30" height="30" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 2l1.6 4.4L14 8l-4.4 1.6L8 14l-1.6-4.4L2 8l4.4-1.6zM15 12l.8 2.2L18 15l-2.2.8L15 18l-.8-2.2L12 15l2.2-.8z" fill="{{orange}}"/></svg>
              <span style="font-size: 18px; font-weight: 600; line-height: 1.45">AI alleen verandert je organisatie niet. Het systeem waarin je AI inzet wel.</span>
            </div>

            <section id="zes-kenmerken" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Zes kenmerken van een effectieve AI-Native ART</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Nu AI teams sneller laat leren en leveren, wordt de ART belangrijker: die zorgt voor afstemming, coördinatie, governance en verbetering, zodat al die snelheid optelt tot echte uitkomsten. Zes kenmerken versterken elkaar. Klik op een kenmerk om ernaartoe te springen.</p>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{aiart.traits}}" as="tr" hint-placeholder-count="6">
                  <a href="#{{tr.id}}" style="{{tr.box}}">
                    <span style="display: flex; align-items: center; gap: 12px"><span style="{{tr.num}}">{{tr.n}}</span><span style="{{tr.iconBox}}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{tr.icon}}" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span>
                    <span style="font-size: 17px; font-weight: 700; color: #1B2A5C">{{tr.title}}</span>
                    <span style="font-size: 13px; line-height: 1.5; color: #3E4A63">{{tr.text}}</span>
                  </a>
                </sc-for>
              </div>
            </section>

            <section id="k1" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #1B2A5C"><span style="color: {{orange}}">1.</span> Georganiseerd rond producten</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Een AI-Native ART bundelt teams rond één product of een groep samenhangende producten: intern (waar de organisatie zelf op draait) of extern (wat klanten afnemen). Dat geeft alle teams één scherpe focus, met duidelijke klanten, een heldere waardepropositie en meetbare uitkomsten.</p>
              <div style="display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px">
                <div style="padding: 20px; border-radius: 14px; background: #E8F4DA; display: flex; flex-direction: column; gap: 10px">
                  <span style="font-size: 15px; font-weight: 700; color: #2F4A0B">Product te groot voor één ART? Denk in ‘outcome surfaces’</span>
                  <span style="font-size: 14px; line-height: 1.55; color: #1E3307">Deel het product zo op dat elk deel zelfstandig meetbare uitkomsten oplevert voor klant en organisatie. Bijvoorbeeld:</span>
                  <span style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{aiart.surfaces}}" as="x" hint-placeholder-count="3"><span style="padding: 6px 12px; border-radius: 14px; background: #FFFFFF; font-size: 13px; font-weight: 700; color: #2F4A0B">{{x.text}}</span></sc-for></span>
                </div>
                <div style="padding: 20px; border-radius: 14px; background: #FCEBEE; display: flex; flex-direction: column; gap: 10px">
                  <span style="font-size: 15px; font-weight: 700; color: #8A0F23">Liever niet: rond een systeem, functie of project</span>
                  <span style="font-size: 14px; line-height: 1.55; color: #4A1019">De focus is dan te smal voor een heldere waardepropositie. En een ART rond een project wordt na afloop opgeheven: zo bouw je nooit blijvend klantbegrip en gezamenlijk leervermogen op.</span>
                </div>
              </div>
            </section>

            <section id="k2" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #1B2A5C"><span style="color: {{orange}}">2.</span> Outcome-gedreven</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Product Management vertaalt de productvisie naar ART-outcomes voor het komende jaar. Met PI- en teamoutcomes ontstaan kortere toezeggingen: samen vormen ze een <strong>outcome tree</strong> die strategie verbindt met het werk van teams. Teams verdelen hun capaciteit over die outcomes en kiezen de output die ze het meest dichterbij brengt.</p>
              <div style="padding: 22px; border-radius: 16px; background: #F4F6FA; display: grid; grid-template-columns: minmax(0, 1fr) 30px minmax(0, 1fr) 30px minmax(0, 1fr); gap: 8px; align-items: stretch">
                <sc-for list="{{aiart.tree}}" as="o" hint-placeholder-count="5">
                  <sc-if value="{{o.isNode}}" hint-placeholder-val="{{ true }}">
                    <div style="{{o.box}}">
                      <span style="{{o.tag}}">{{o.level}}</span>
                      <span style="font-size: 15px; font-weight: 700; line-height: 1.35; color: #1B2A5C">{{o.text}}</span>
                      <span style="font-size: 12px; line-height: 1.45; color: #3E4A63">{{o.note}}</span>
                    </div>
                  </sc-if>
                  <sc-if value="{{o.isArrow}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3l7 7-7 7" fill="none" stroke="{{blue}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></sc-if>
                </sc-for>
              </div>
              <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #3E4A63">Doordat elk team weet hoe zijn eigen key result bijdraagt aan de PI-outcome, kan het tijdens de PI bijsturen op data: een experiment aanpassen, een feature stoppen die niets beweegt, of capaciteit verschuiven naar een kansrijkere aanpak. De ART zorgt dat al die lokale keuzes op één lijn blijven.</p>
            </section>

            <section id="k3" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #1B2A5C"><span style="color: {{orange}}">3.</span> Gedreven door menselijke expertise en oordeel</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">AI helpt meer opties te verkennen en meer informatie te verwerken dan mensen alleen kunnen. Maar mensen brengen de product- en domeinkennis om die opties te beoordelen, en zij blijven verantwoordelijk voor de besluiten.</p>
              <div style="padding: 20px 22px; border-radius: 16px; background: #F4F6FA; display: flex; align-items: center; gap: 22px; flex-wrap: wrap">
                <span style="display: flex; flex-direction: column; gap: 4px; min-width: 220px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: {{blue}}">De motor van de ART</span><span style="font-size: 18px; font-weight: 700; color: #1B2A5C">AI-Native Teams · 3–7 mensen</span><span style="font-size: 13px; line-height: 1.5; color: #3E4A63">Elk teamlid versterkt met AI. Het team is eigenaar van zijn output én zijn outcomes, en moet dus begrijpen wat het goedkeurt.</span></span>
                <span style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{aiart.capabilities}}" as="c" hint-placeholder-count="4"><span style="{{c.pill}}">{{c.text}}</span></sc-for></span>
              </div>
              <span style="font-size: 18px; font-weight: 700; color: #1B2A5C; margin-top: 6px">ART-leiderschap: het tempo bijhouden</span>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{aiart.leaders}}" as="l" hint-placeholder-count="4">
                  <div style="padding: 16px; border-radius: 14px; border: 1.5px solid #D5DBE5; border-top: 5px solid {{l.color}}; display: flex; flex-direction: column; gap: 8px">
                    <span style="font-size: 15px; font-weight: 700; color: #1B2A5C">{{l.role}}</span>
                    <span style="font-size: 13px; line-height: 1.5; color: #3E4A63">{{l.text}}</span>
                    <span style="margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 8px; background: #F4F6FA">
                      <span style="font-size: 12px; color: #5A6478; text-decoration: line-through">{{l.from}}</span>
                      <span style="font-size: 12px; font-weight: 700; color: #1B2A5C">→ {{l.to}}</span>
                    </span>
                  </div>
                </sc-for>
              </div>
              <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px">
                <div style="padding: 16px 18px; border-radius: 14px; background: #F1EBFB; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 700; color: #3A1D6E">AI Value Architects</span><span style="font-size: 13px; line-height: 1.5; color: #2E2238">Veel organisaties halen minder waarde uit AI dan verwacht. AI Value Architects zijn de ontbrekende schakel: een vaste rol op de ART die teams helpt AI effectief in te zetten, per team, per product of voor de hele ART.</span></div>
                <div style="padding: 16px 18px; border-radius: 14px; background: #F1F4DC; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; font-weight: 700; color: #3E4A00">Bij EDSN: het Tactisch vierkant</span><span style="font-size: 13px; line-height: 1.5; color: #2E3A10">Naast PM, SA en RTE heeft het EDSN-leiderschapsteam een People Developer. Samen met de Business Owners houden zij het tempo van leren en beslissen bij.</span></div>
              </div>
              <span style="font-size: 18px; font-weight: 700; color: #1B2A5C; margin-top: 6px">Een mensgerichte AI-cultuur: drie hefbomen</span>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{aiart.culture}}" as="c" hint-placeholder-count="3">
                  <div style="padding: 16px 18px; border-radius: 14px; border: 1.5px solid #D5DBE5; display: flex; gap: 12px; align-items: flex-start">
                    <span style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: {{orange}}; color: #2B1A00; font-weight: 800">{{c.n}}</span>
                    <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 700; color: #1B2A5C">{{c.title}}</span><span style="font-size: 13px; line-height: 1.5; color: #3E4A63">{{c.text}}</span></span>
                  </div>
                </sc-for>
              </div>
            </section>

            <section id="k4" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #1B2A5C"><span style="color: {{orange}}">4.</span> Snelle innovatie in balans met leren op cadans</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Teams werken in flow, op AI-snelheid. De ART brengt cadans met iteraties, PI’s en events. Hoe sneller teams gaan, hoe belangrijker dat ritme: lokale keuzes en afhankelijkheden stapelen zich op, en periodieke afstemming voorkomt dat het product uit koers raakt.</p>
              <div style="display: flex; flex-direction: column; gap: 8px">
                <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 12px 18px; border-radius: 10px; background: #EEF2F7; font-size: 14px; font-weight: 700; color: #1B2A5C"><span>Ritme</span><span>Team</span><span>ART</span></div>
                <sc-for list="{{aiart.cadence}}" as="c" hint-placeholder-count="3">
                  <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 14px 18px; border-radius: 10px; border: 1px solid #D5DBE5; align-items: start">
                    <span style="{{c.tag}}">{{c.rhythm}}</span>
                    <span style="font-size: 13px; line-height: 1.55; color: #2E3A55">{{c.team}}</span>
                    <span style="font-size: 13px; line-height: 1.55; color: #2E3A55">{{c.art}}</span>
                  </div>
                </sc-for>
              </div>
              <span style="font-size: 18px; font-weight: 700; color: #1B2A5C; margin-top: 6px">ART-events, gefaciliteerd door de RTE</span>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{aiart.events}}" as="e" hint-placeholder-count="3">
                  <div style="padding: 18px; border-radius: 14px; background: #F4F6FA; display: flex; flex-direction: column; gap: 8px">
                    <span style="display: flex; align-items: center; gap: 10px"><span style="display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: #FFF1DA; border: 2.5px solid {{orange}}"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{e.icon}}" fill="none" stroke="#1B2A5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span style="font-size: 16px; font-weight: 700; color: #1B2A5C">{{e.title}}</span></span>
                    <span style="font-size: 12px; font-weight: 700; color: {{blue}}">{{e.when}}</span>
                    <span style="font-size: 13px; line-height: 1.5; color: #3E4A63">{{e.text}}</span>
                  </div>
                </sc-for>
              </div>
              <span style="font-size: 18px; font-weight: 700; color: #1B2A5C; margin-top: 6px">Collectief leren: drie soorten</span>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{aiart.learning}}" as="lr" hint-placeholder-count="3">
                  <div style="padding: 18px; border-radius: 14px; border: 1.5px solid #D5DBE5; border-top: 5px solid {{lr.color}}; display: flex; flex-direction: column; gap: 8px">
                    <span style="font-size: 16px; font-weight: 700; color: #1B2A5C">{{lr.title}}</span>
                    <span style="font-size: 13px; line-height: 1.5; color: #3E4A63">{{lr.text}}</span>
                    <span style="margin-top: auto; padding: 10px 12px; border-radius: 8px; background: #F4F6FA; font-size: 12px; line-height: 1.5; color: #1B2A5C"><strong>Voorbeeld:</strong> {{lr.ex}}</span>
                  </div>
                </sc-for>
              </div>
            </section>

            <section id="k5" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #1B2A5C"><span style="color: {{orange}}">5.</span> Gedeelde AI-workflows en platformen optimaliseren</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">De <strong>AI Innovation Pipeline (AIIP)</strong> geeft één samenhangend geheel van gedeelde platformen, gecureerde data en voorzieningen over de hele productlevenscyclus. Teams profiteren van verbeterde workflows zonder hetzelfde probleem steeds lokaal op te lossen.</p>
              <div style="padding: 22px; border-radius: 16px; background: #F4F6FA; display: flex; flex-direction: column; gap: 14px">
                <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
                  <sc-for list="{{aiart.phases}}" as="ph" hint-placeholder-count="5"><span style="{{ph.style}}">{{ph.name}}</span></sc-for>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 8px">
                  <sc-for list="{{aiart.aiip}}" as="x" hint-placeholder-count="8"><span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #D5DBE5; font-size: 13px; font-weight: 600; color: #1B2A5C"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{blue}}"></span>{{x.text}}</span></sc-for>
                </div>
              </div>
              <span style="font-size: 18px; font-weight: 700; color: #1B2A5C; margin-top: 6px">Drie pijlers: intentie, specificaties en context</span>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{aiart.pillars}}" as="p" hint-placeholder-count="3">
                  <div style="{{p.box}}">
                    <span style="font-size: 30px; font-weight: 800; line-height: 1">{{p.q}}</span>
                    <span style="font-size: 17px; font-weight: 700">{{p.title}}</span>
                    <span style="font-size: 13px; line-height: 1.5; opacity: .92">{{p.text}}</span>
                  </div>
                </sc-for>
              </div>
              <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #3E4A63">Zonder deze drie werkt AI in het luchtledige en levert het irrelevante of verzonnen resultaten op. Expliciet gemaakt vormen ze de gedeelde basis waarop een ART redeneert, of de volgende beslissing nu door een mens of door een agent wordt genomen.</p>
              <span style="font-size: 18px; font-weight: 700; color: #1B2A5C; margin-top: 6px">Van lokale innovatie naar gedeelde standaard</span>
              <div style="display: grid; grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr) 26px minmax(0, 1fr) 26px minmax(0, 1fr); gap: 6px; align-items: stretch">
                <sc-for list="{{aiart.promote}}" as="s" hint-placeholder-count="7">
                  <sc-if value="{{s.isStep}}" hint-placeholder-val="{{ true }}"><div style="padding: 14px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #D5DBE5; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 800; color: {{s.color}}">{{s.who}}</span><span style="font-size: 13px; line-height: 1.45; color: #1B2A5C">{{s.text}}</span></div></sc-if>
                  <sc-if value="{{s.isArrow}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3l7 7-7 7" fill="none" stroke="{{blue}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></sc-if>
                </sc-for>
              </div>
              <span style="font-size: 18px; font-weight: 700; color: #1B2A5C; margin-top: 6px">Elk team een eigen werkmix</span>
              <div style="padding: 20px 22px; border-radius: 16px; background: #F4F6FA; display: flex; flex-direction: column; gap: 10px">
                <span style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; font-weight: 600; color: #3E4A63"><sc-for list="{{aiart.mixLegend}}" as="lg" hint-placeholder-count="5"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: {{lg.color}}"></span>{{lg.label}}</span></sc-for><span style="margin-left: auto; font-style: italic">voorbeeld</span></span>
                <sc-for list="{{aiart.mix}}" as="m" hint-placeholder-count="3">
                  <div style="display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 14px; align-items: center">
                    <span style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #1B2A5C">{{m.name}}</span><span style="font-size: 12px; color: #5A6478">{{m.kind}}</span></span>
                    <span style="display: flex; height: 26px; border-radius: 6px; overflow: hidden"><sc-for list="{{m.parts}}" as="pt" hint-placeholder-count="4"><span style="{{pt}}"></span></sc-for></span>
                  </div>
                </sc-for>
                <span style="font-size: 13px; line-height: 1.5; color: #3E4A63">Een prototype verkent een mogelijkheid, een experiment toetst een hypothese, een feature levert klantdata op en een enabler laat zien of een technische investering werkt. Het ART-leiderschap zoekt in al dat bewijs naar patronen die geen enkel team alleen ziet.</span>
              </div>
            </section>

            <section id="k6" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #1B2A5C"><span style="color: {{orange}}">6.</span> AI-governance en ethiek borgen</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Naast het coördineren van werk heeft de ART er in het AI-tijdperk een taak bij. Ongecontroleerde AI brengt juridische, data- en ethische risico’s met zich mee. Dat kun je niet bij de teams neerleggen: het vraagt om centrale standaarden waarbinnen teams werken.</p>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
                <div style="padding: 16px 18px; border-radius: 14px; background: {{navy}}; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: {{orange}}">Verantwoordelijkheid 1</span><span style="font-size: 15px; font-weight: 600; line-height: 1.45">Zorgen voor kennis van, en naleving van, de AI-governance, ethische richtlijnen en guardrails van het portfolio.</span></div>
                <div style="padding: 16px 18px; border-radius: 14px; background: {{navy}}; color: #FFFFFF; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: {{orange}}">Verantwoordelijkheid 2</span><span style="font-size: 15px; font-weight: 600; line-height: 1.45">Aanvullende richtlijnen en guardrails vastleggen die specifiek zijn voor de producten en de context van de ART.</span></div>
              </div>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{aiart.gov}}" as="g" hint-placeholder-count="4">
                  <div style="padding: 16px; border-radius: 14px; border: 1.5px solid #D5DBE5; display: flex; flex-direction: column; gap: 8px">
                    <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; background: {{g.color}}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="{{g.icon}}" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                    <span style="font-size: 15px; font-weight: 700; color: #1B2A5C">{{g.title}}</span>
                    <span style="font-size: 13px; line-height: 1.5; color: #3E4A63">{{g.text}}</span>
                  </div>
                </sc-for>
              </div>
              <div style="padding: 14px 18px; border-radius: 12px; border: 2px solid #C8102E; background: #FCEBEE; display: flex; align-items: center; gap: 12px">
                <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2zM12 10v5M12 18h.01" fill="none" stroke="#C8102E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span style="font-size: 14px; line-height: 1.5; color: #4A1019"><strong>Soms betekent governance: stoppen.</strong> Is het bewijs onvolledig of het risico groter dan afgesproken, dan gaat een deployment niet door. Werk dat het vertrouwen van klanten kan schaden, stopt. Heldere standaarden zorgen er tegelijk voor dat besluiten met een laag risico geen onnodige vertraging krijgen.</span>
              </div>
            </section>
          </div>
          </sc-if>

          <!-- ===== Customer & Business Value ===== -->
          <sc-if value="{{page.isBV}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 36px">
            <section id="waardedraad" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Businesswaarde verbindt elke beslissing</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Van het doel van de organisatie tot de dagelijkse uitvoering: businesswaarde is de rode draad die alle keuzes met elkaar verbindt.</p>
              <div style="position: relative; padding: 30px 24px; border-radius: 16px; background: #F4F6FA">
                <span style="position: absolute; left: 12%; right: 12%; top: 72px; height: 6px; border-radius: 3px; background: {{orange}}"></span>
                <span class="bv-pulse" style="{{bv.pulse}}"></span>
                <div style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
                  <sc-for list="{{bv.chain}}" as="c" hint-placeholder-count="4">
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
                      <span style="{{c.iconBox}}"><svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="{{c.icon}}" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                      <span style="font-size: 16px; font-weight: 700; color: #1B2A5C">{{c.title}}</span>
                      <span style="font-size: 13px; line-height: 1.5; color: #3E4A63">{{c.text}}</span>
                    </div>
                  </sc-for>
                </div>
                <span style="position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 3px 12px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid {{orange}}; font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #7A4A00">businesswaarde</span>
              </div>
            </section>

            <section id="hefboom" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Strategie: werken vanuit je hefboompunten</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Een doel geeft richting, maar nog geen plan. Strategie is de brug: geen lijst met doelen, maar een manier om de unieke sterktes van de organisatie in te zetten, die anderen moeilijk kunnen kopiëren.</p>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{bv.levers}}" as="l" hint-placeholder-count="4">
                  <div style="padding: 18px; border-radius: 14px; border: 1.5px solid #D5DBE5; border-top: 5px solid {{l.color}}; display: flex; flex-direction: column; gap: 8px">
                    <span style="font-size: 16px; font-weight: 700; color: #1B2A5C">{{l.title}}</span>
                    <span style="font-size: 13px; line-height: 1.5; color: #3E4A63">{{l.text}}</span>
                    <span style="margin-top: auto; padding: 8px 10px; border-radius: 8px; background: #F4F6FA; font-size: 12px; line-height: 1.45; color: #1B2A5C"><strong>Bij EDSN:</strong> {{l.edsn}}</span>
                  </div>
                </sc-for>
              </div>
            </section>

            <section id="valkuil" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Waarde uit het oog verliezen, of er samen op sturen</h2>
              <div style="display: grid; grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr); gap: 10px; align-items: stretch">
                <div style="padding: 20px 22px; border-radius: 14px; background: #FCEBEE; display: flex; flex-direction: column; gap: 10px">
                  <span style="font-size: 16px; font-weight: 700; color: #8A0F23">Zonder waardefocus</span>
                  <sc-for list="{{bv.without}}" as="w" hint-placeholder-count="4"><span style="display: flex; gap: 8px; font-size: 14px; line-height: 1.5; color: #4A1019"><span style="flex-shrink: 0; margin-top: 7px; width: 6px; height: 6px; border-radius: 50%; background: #C8102E"></span>{{w.text}}</span></sc-for>
                  <span style="margin-top: auto; padding-top: 8px; border-top: 1px solid #F3C4CC; font-size: 13px; font-weight: 700; color: #8A0F23">→ versnippering, verspilling en zwakke resultaten</span>
                </div>
                <span style="display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="{{blue}}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <div style="padding: 20px 22px; border-radius: 14px; background: #E8F4DA; display: flex; flex-direction: column; gap: 10px">
                  <span style="font-size: 16px; font-weight: 700; color: #2F4A0B">Met waardefocus</span>
                  <sc-for list="{{bv.with}}" as="w" hint-placeholder-count="4"><span style="display: flex; gap: 8px; font-size: 14px; line-height: 1.5; color: #1E3307"><span style="flex-shrink: 0; margin-top: 7px; width: 6px; height: 6px; border-radius: 50%; background: #5E8A12"></span>{{w.text}}</span></sc-for>
                  <span style="margin-top: auto; padding-top: 8px; border-top: 1px solid #C9E2AA; font-size: 13px; font-weight: 700; color: #2F4A0B">→ decentrale besluiten die bijdragen aan hetzelfde doel</span>
                </div>
              </div>
            </section>

            <section id="waarde-in-safe" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Waar waarde terugkomt in het delivery model</h2>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{bv.artifacts}}" as="a" hint-placeholder-count="3">
                  <div style="padding: 18px 20px; border-radius: 14px; border: 1.5px solid #D5DBE5; display: flex; flex-direction: column; gap: 8px">
                    <span style="display: flex; align-items: center; gap: 10px"><span style="{{a.chip}}">{{a.level}}</span><span style="font-size: 16px; font-weight: 700; color: #1B2A5C">{{a.title}}</span></span>
                    <span style="font-size: 14px; line-height: 1.55; color: #3E4A63">{{a.text}}</span>
                  </div>
                </sc-for>
              </div>
              <p style="margin: 0; padding: 14px 18px; border-radius: 10px; background: #FFF4E3; font-size: 15px; line-height: 1.6; color: #1B2A5C">Deze uitingen van waarde werken alleen als ze gebaseerd zijn op een echt begrip van het bedrijf. Dat begrip ontstaat via <strong>business value discovery</strong>: samen met klanten, Business Owners en teams scherp krijgen wat voor EDSN echt waardevol is.</p>
            </section>

            <section id="meten" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Meten op resultaat: gepland versus gerealiseerd</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Bij de PI-planning kennen Business Owners aan elk PI-doel een businesswaarde toe (1 tot 10). Aan het eind van de PI beoordelen ze wat er werkelijk is opgeleverd. De verhouding tussen gerealiseerde en geplande waarde laat zien hoe voorspelbaar de ART levert.</p>
              <div style="padding: 22px; border-radius: 16px; background: #F4F6FA; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: center">
                <div style="display: flex; flex-direction: column; gap: 10px">
                  <span style="display: flex; gap: 16px; font-size: 12px; font-weight: 600; color: #3E4A63"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 10px; border-radius: 2px; background: #C9D1DD"></span>gepland</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 10px; border-radius: 2px; background: {{blue}}"></span>gerealiseerd</span><span style="margin-left: auto; font-style: italic">voorbeeld</span></span>
                  <sc-for list="{{bv.objectives}}" as="o" hint-placeholder-count="5">
                    <div style="display: grid; grid-template-columns: 170px minmax(0, 1fr) 54px; gap: 12px; align-items: center">
                      <span style="font-size: 13px; font-weight: 600; color: #1B2A5C">{{o.name}}</span>
                      <span style="position: relative; display: block; height: 22px; border-radius: 4px; background: #FFFFFF">
                        <span style="{{o.planned}}"></span>
                        <span style="{{o.actual}}"></span>
                      </span>
                      <span style="font-size: 13px; font-weight: 700; color: #1B2A5C; text-align: right">{{o.score}}</span>
                    </div>
                  </sc-for>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
                  <svg width="190" height="110" viewBox="0 0 190 110" role="img" aria-label="Voorspelbaarheid {{bv.pct}} procent, binnen de bandbreedte van 80 tot 100 procent">
                    <path d="M15 95a80 80 0 0 1 160 0" fill="none" stroke="#E1E6EE" stroke-width="16"/>
                    <path d="{{bv.band}}" fill="none" stroke="#95C11F" stroke-width="16"/>
                    <path d="{{bv.needle}}" stroke="#1B2A5C" stroke-width="4" stroke-linecap="round"/>
                    <circle cx="95" cy="95" r="7" fill="#1B2A5C"/>
                  </svg>
                  <span style="font-size: 32px; font-weight: 800; color: #1B2A5C; line-height: 1">{{bv.pct}}%</span>
                  <span style="font-size: 13px; line-height: 1.45; color: #3E4A63">ART-voorspelbaarheid. Een gezonde ART zit doorgaans tussen <strong>80% en 100%</strong> (groene band).</span>
                </div>
              </div>
            </section>
          </div>
          </sc-if>

          <!-- ===== People Developer: people authority & people debt ===== -->
          <sc-if value="{{page.isPD}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 36px">
            <div style="padding: 14px 18px; border-radius: 10px; background: #F4F6FA; font-size: 13px; color: #3E4A63">De onderdelen hieronder zijn gebaseerd op de whitepaper <strong>‘The People Runway of the ART’</strong> (Just Leading Solutions, 2020), in eigen woorden vertaald naar de EDSN-situatie.</div>

            <section id="people-authority" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">De people authority: het vierde hoekpunt van het T4K</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Op een ART heeft elke leiderschapsrol een eigen autoriteit. Lange tijd had niemand mensen als eerste prioriteit. De People Developer vult dat gat: met een expliciet mandaat om mensen voorop te zetten. Daarmee wordt de triade een vierkant.</p>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{pr.authorities}}" as="au" hint-placeholder-count="4">
                  <div style="{{au.box}}">
                    <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; opacity: .85">{{au.kind}}</span>
                    <span style="font-size: 34px; font-weight: 800; line-height: 1">{{au.abbr}}</span>
                    <span style="font-size: 15px; font-weight: 700">{{au.role}}</span>
                    <span style="font-size: 13px; line-height: 1.5; opacity: .92">{{au.focus}}</span>
                    <sc-if value="{{au.isNew}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; margin-top: 4px; padding: 2px 10px; border-radius: 10px; background: #FFFFFF; color: #3E4A00; font-size: 11px; font-weight: 800">ontbrak in de triade</span></sc-if>
                  </div>
                </sc-for>
              </div>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
                <div style="padding: 18px 20px; border-radius: 12px; background: #F1F4DC; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 30px; font-weight: 800; color: #5E6E0C">1–3</span><span style="font-size: 14px; color: #1B2A5C">People Developers per ART</span></div>
                <div style="padding: 18px 20px; border-radius: 12px; background: #F1F4DC; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 30px; font-weight: 800; color: #5E6E0C">20–40</span><span style="font-size: 14px; color: #1B2A5C">mensen per People Developer</span></div>
                <div style="padding: 18px 20px; border-radius: 12px; background: #F1F4DC; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 30px; font-weight: 800; color: #5E6E0C">≠ SM</span><span style="font-size: 14px; color: #1B2A5C">Overlap met de Scrum Master in coaching, maar met een ander mandaat en een bredere reikwijdte (workforce, leren, talent over ART’s heen)</span></div>
              </div>
            </section>

            <section id="people-debt" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">People debt: de verborgen schuld</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Net als technical debt ontstaat people debt wanneer we op korte termijn kiezen voor snelheid en daarbij investeringen in mensen overslaan. Het staat op geen enkele balans, maar de rente loopt wel op.</p>
              <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px; align-items: stretch">
                <div style="padding: 20px; border-radius: 14px; border: 1.5px solid #D5DBE5; display: flex; flex-direction: column; gap: 10px">
                  <span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #1B2A5C"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5" fill="none" stroke="{{blue}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Technical debt</span>
                  <span style="font-size: 14px; line-height: 1.55; color: #3E4A63">Snel opleveren zonder schone code, documentatie of tests. Later betaal je met herwerk.</span>
                  <span style="margin-top: auto; padding: 8px 10px; border-radius: 8px; background: #EEF2F7; font-size: 13px; font-weight: 600; color: #1B2A5C">Afgelost met enablers op de architectural runway</span>
                </div>
                <div style="padding: 20px; border-radius: 14px; border: 2px solid #A9BC2B; background: #FAFBF0; display: flex; flex-direction: column; gap: 10px">
                  <span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: #1B2A5C"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1M17 3a4 4 0 0 1 0 8M22 21v-1a6 6 0 0 0-4-5.6" fill="none" stroke="#5E6E0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>People debt</span>
                  <span style="font-size: 14px; line-height: 1.55; color: #3E4A63">Te druk (of te afwijzend) om te investeren in ontwikkeling, teamdynamiek en een HR-aanpak die past bij agile werken.</span>
                  <span style="margin-top: auto; padding: 8px 10px; border-radius: 8px; background: #F1F4DC; font-size: 13px; font-weight: 600; color: #1B2A5C">Afgelost met people enablers op de people runway</span>
                </div>
                <div style="padding: 20px; border-radius: 14px; background: #F4F6FA; display: flex; flex-direction: column; gap: 8px">
                  <span style="font-size: 15px; font-weight: 700; color: #1B2A5C">Onbetaalde people debt leidt tot…</span>
                  <sc-for list="{{pr.spiral}}" as="sp" hint-placeholder-count="5">
                    <span style="{{sp.bar}}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M4 9l4 4 4-4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>{{sp.text}}</span>
                  </sc-for>
                </div>
              </div>
              <div style="padding: 18px 20px; border-radius: 14px; border: 1.5px dashed #C8102E; display: flex; flex-direction: column; gap: 10px">
                <span style="font-size: 15px; font-weight: 700; color: #1B2A5C">Herkenbare signalen van een people-debt-cultuur</span>
                <div style="display: flex; flex-wrap: wrap; gap: 8px">
                  <sc-for list="{{pr.signs}}" as="sg" hint-placeholder-count="10">
                    <span style="padding: 5px 12px; border-radius: 14px; background: #FCEBEE; color: #8A0F23; font-size: 13px; font-weight: 600">{{sg.text}}</span>
                  </sc-for>
                </div>
              </div>
            </section>

            <section id="capaciteit" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Capaciteitsallocatie: ruimte voor people enablers</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Weeg je één people-onderwerp af tegen één feature, dan verliest het people-onderwerp bijna altijd. Daarom spreekt het T4K vóór de PI-planning een vaste verdeling van capaciteit af, zodat ook people enablers een plek in de backlog krijgen.</p>
              <div style="padding: 22px; border-radius: 16px; background: #F4F6FA; display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1fr) 120px; gap: 24px; align-items: center">
                <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
                  <sc-for list="{{pr.alloc}}" as="al" hint-placeholder-count="4">
                    <div style="padding: 14px; border-radius: 12px; background: #FFFFFF; border: 1.5px solid #D5DBE5; display: flex; flex-direction: column; gap: 8px">
                      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #5A6478">{{al.kind}}</span>
                      <span style="font-size: 14px; font-weight: 700; color: #1B2A5C">{{al.role}}</span>
                      <span style="font-size: 12px; line-height: 1.45; color: #3E4A63; min-height: 52px">{{al.promise}}</span>
                      <sc-for list="{{al.items}}" as="it" hint-placeholder-count="3"><span style="{{al.chip}}">{{al.item}}</span></sc-for>
                    </div>
                  </sc-for>
                </div>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
                  <svg width="170" height="170" viewBox="0 0 160 160" role="img" aria-label="Voorbeeld capaciteitsverdeling">
                    <sc-for list="{{pr.donut}}" as="d" hint-placeholder-count="4">
                      <circle cx="80" cy="80" r="58" fill="none" stroke="{{d.color}}" stroke-width="26" stroke-dasharray="{{d.dash}}" stroke-dashoffset="{{d.off}}" transform="rotate(-90 80 80)"/>
                    </sc-for>
                    <text x="80" y="76" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="600" fill="#3E4A63">voorbeeld</text>
                    <text x="80" y="94" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" font-weight="700" fill="#1B2A5C">verdeling</text>
                  </svg>
                  <div style="display: flex; flex-direction: column; gap: 4px">
                    <sc-for list="{{pr.donut}}" as="d" hint-placeholder-count="4">
                      <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #1B2A5C"><span style="width: 12px; height: 12px; border-radius: 3px; background: {{d.color}}"></span>{{d.pct}}% {{d.label}}</span>
                    </sc-for>
                  </div>
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px; padding: 10px; border-radius: 10px; background: #FFFFFF; border: 1.5px solid #D5DBE5">
                  <span style="font-size: 11px; font-weight: 700; color: #5A6478; text-align: center">ART-backlog</span>
                  <sc-for list="{{pr.backlog}}" as="b" hint-placeholder-count="10"><span style="{{b}}"></span></sc-for>
                </div>
              </div>
            </section>

            <section id="pd-verantwoordelijkheden" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Kernverantwoordelijkheden van de people authority</h2>
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
                <sc-for list="{{pr.resp}}" as="r" hint-placeholder-count="8">
                  <div style="padding: 16px; border-radius: 12px; border: 1.5px solid #D5DBE5; border-top: 5px solid #A9BC2B; display: flex; flex-direction: column; gap: 8px">
                    <span style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: #F1F4DC"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.icon}}" fill="none" stroke="#5E6E0C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                    <span style="font-size: 14px; font-weight: 600; line-height: 1.45; color: #1B2A5C">{{r.text}}</span>
                  </div>
                </sc-for>
              </div>
            </section>
          </div>
          </sc-if>

          <!-- ===== ART Development & Enablement: de people runway ===== -->
          <sc-if value="{{page.isPR}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 36px">
            <div style="padding: 14px 18px; border-radius: 10px; background: #F4F6FA; font-size: 13px; color: #3E4A63">De people runway is gebaseerd op de whitepaper <strong>‘The People Runway of the ART’</strong> (Just Leading Solutions, 2020), in eigen woorden vertaald naar de EDSN-situatie.</div>

            <section id="runway" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Twee runways onder de ART</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">De architectural runway zorgt dat de techniek klaarstaat voor de features van morgen. De people runway doet hetzelfde voor mensen: de gezamenlijke sterktes, vaardigheden en ervaring van de ART, en het vermogen om die optimaal in te zetten voor huidige én nieuwe initiatieven.</p>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
                <sc-for list="{{pr.runways}}" as="rw" hint-placeholder-count="2">
                  <div style="padding: 20px 22px; border-radius: 14px; border: 1.5px solid #D5DBE5; display: flex; flex-direction: column; gap: 12px">
                    <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><span style="font-size: 18px; font-weight: 700; color: #1B2A5C">{{rw.title}}</span><span style="{{rw.owner}}">{{rw.who}}</span></span>
                    <svg width="100%" height="26" viewBox="0 0 600 26" preserveAspectRatio="none" aria-hidden="true"><path d="M0 13H600" stroke="#E3E7EE" stroke-width="22" stroke-linecap="round"/><path d="{{rw.path}}" fill="none" stroke="{{rw.color}}" stroke-width="3.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
                    <span style="font-size: 14px; line-height: 1.55; color: #3E4A63">{{rw.text}}</span>
                    <span style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{rw.items}}" as="it" hint-placeholder-count="3"><span style="{{rw.chip}}">{{it.text}}</span></sc-for></span>
                  </div>
                </sc-for>
              </div>
            </section>

            <section id="bouwstenen" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Zo bouw je een sterke people runway</h2>
              <div style="position: relative; padding: 26px 22px 22px; border-radius: 16px; background: #F4F6FA">
                <svg style="position: absolute; left: 22px; right: 22px; top: 54px; width: calc(100% - 44px)" height="24" viewBox="0 0 1000 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12H1000" stroke="#E3E7EE" stroke-width="20" stroke-linecap="round"/><path d="M0 4 L50 20 L100 6 L150 19 L200 3 L250 21 L300 8 L350 17 L400 4 L450 20 L500 6 L550 18 L600 3 L650 21 L700 7 L750 19 L800 4 L850 20 L900 6 L950 18 L1000 5" fill="none" stroke="#C8102E" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
                <div style="position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
                  <sc-for list="{{pr.practices}}" as="pc" hint-placeholder-count="5">
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
                      <span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; border: 3px solid #C8102E"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="{{pc.icon}}" fill="none" stroke="#1B2A5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                      <span style="font-size: 15px; font-weight: 700; color: #1B2A5C">{{pc.title}}</span>
                      <span style="font-size: 13px; line-height: 1.5; color: #3E4A63">{{pc.text}}</span>
                    </div>
                  </sc-for>
                </div>
              </div>
            </section>

            <section id="strategisch-operationeel" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Strategisch en operationeel werk</h2>
              <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3E4A63">Een sterke people runway vraagt altijd werk op twee niveaus. Strategisch werk vernieuwt het systeem en wordt meestal op portfolio- of organisatieniveau gecoördineerd. Operationeel werk is het dagelijkse grondwerk op individu-, team- en ART-niveau, onder leiding van de People Developers.</p>
              <div style="display: flex; flex-direction: column; gap: 8px">
                <div style="display: grid; grid-template-columns: 170px minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 12px 18px; border-radius: 10px; background: #EEF2F7; font-size: 14px; font-weight: 700; color: #1B2A5C"><span>Domein</span><span style="color: #4A2A5C">Strategisch · transformerend</span><span style="color: #00706D">Operationeel · doorlopend</span></div>
                <sc-for list="{{pr.levels}}" as="lv" hint-placeholder-count="5">
                  <div style="display: grid; grid-template-columns: 170px minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 14px 18px; border-radius: 10px; border: 1px solid #D5DBE5; align-items: start">
                    <span style="font-size: 15px; font-weight: 700; color: #1B2A5C">{{lv.domain}}</span>
                    <span style="padding: 10px 12px; border-radius: 8px; background: #F4EEF5; font-size: 13px; line-height: 1.5; color: #2E2238">{{lv.strat}}</span>
                    <span style="padding: 10px 12px; border-radius: 8px; background: #E5F4F3; font-size: 13px; line-height: 1.5; color: #0E3533">{{lv.oper}}</span>
                  </div>
                </sc-for>
              </div>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
                <div style="padding: 18px 20px; border-radius: 14px; background: #F4EEF5; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 15px; font-weight: 700; color: #4A2A5C">Voorbeelden van strategische initiatieven</span><span style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{pr.stratEx}}" as="x" hint-placeholder-count="7"><span style="padding: 5px 11px; border-radius: 14px; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #4A2A5C">{{x.text}}</span></sc-for></span></div>
                <div style="padding: 18px 20px; border-radius: 14px; background: #E5F4F3; display: flex; flex-direction: column; gap: 10px"><span style="font-size: 15px; font-weight: 700; color: #00706D">Voorbeelden van operationeel werk</span><span style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{pr.operEx}}" as="x" hint-placeholder-count="10"><span style="padding: 5px 11px; border-radius: 14px; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #00706D">{{x.text}}</span></sc-for></span></div>
              </div>
            </section>

            <section id="procesopzet" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Wie doet wat: de procesopzet</h2>
              <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
                <div style="padding: 22px; border-radius: 16px; background: #F4EEF5; display: flex; flex-direction: column; align-items: center; gap: 12px">
                  <span style="align-self: flex-start; font-size: 15px; font-weight: 700; color: #4A2A5C">Strategische, systemische initiatieven</span>
                  <span style="padding: 8px 16px; border-radius: 20px; background: #FFFFFF; border: 2px solid #8C6A9E; font-size: 13px; font-weight: 700; color: #4A2A5C">Sponsor · Business Owners, LACE, HR-leiding</span>
                  <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 0v14M2 10l5 6 5-6" fill="none" stroke="#8C6A9E" stroke-width="2"/></svg>
                  <div style="display: flex; align-items: center; gap: 12px">
                    <span style="padding: 8px 12px; border-radius: 12px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #4A2A5C">Agile coaches</span>
                    <span style="display: flex; align-items: center; justify-content: center; width: 150px; height: 150px; border-radius: 50%; background: #6E4A7E; color: #FFFFFF; text-align: center; font-size: 14px; font-weight: 700; line-height: 1.35; padding: 14px; box-sizing: border-box">Levering · people authority, HR CoE, HR-team</span>
                    <span style="padding: 8px 12px; border-radius: 12px; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #4A2A5C">Interne / externe consultants</span>
                  </div>
                  <span style="width: 100%; max-width: 460px; padding: 10px 14px; border-radius: 0 0 40px 40px; background: #FFFFFF; border: 2px solid #8C6A9E; border-top: 0; text-align: center; font-size: 13px; font-weight: 700; color: #4A2A5C">Ondersteuning · teams · T4K · HR CoE’s</span>
                </div>
                <div style="padding: 22px; border-radius: 16px; background: #E5F4F3; display: flex; flex-direction: column; gap: 12px">
                  <span style="font-size: 15px; font-weight: 700; color: #00706D">Operationeel, tactisch werk</span>
                  <div style="position: relative; height: 290px">
                    <svg style="position: absolute; left: 50%; top: 50%; margin: -110px 0 0 -110px" width="220" height="220" viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="96" fill="none" stroke="#00A6A0" stroke-width="2.5" stroke-dasharray="10 8"/><path d="M196 92l10 18 8-20" fill="none" stroke="#00A6A0" stroke-width="2.5"/><path d="M30 160l-12-16-6 22" fill="none" stroke="#00A6A0" stroke-width="2.5"/></svg>
                    <span style="position: absolute; left: 50%; top: 50%; margin: -44px 0 0 -44px; width: 88px; height: 88px; border-radius: 50%; background: #FFFFFF; border: 3px solid #1B2A5C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><svg width="26" height="30" viewBox="0 0 22 26" aria-hidden="true"><circle cx="11" cy="7" r="5" fill="#1B2A5C"/><path d="M1 26v-5a7 7 0 0 1 7-7h6a7 7 0 0 1 7 7v5z" fill="#1B2A5C"/></svg><span style="font-size: 12px; font-weight: 700; color: #1B2A5C">Medewerker</span></span>
                    <span style="position: absolute; left: 50%; top: 0; margin-left: -70px; width: 140px; padding: 8px; border-radius: 12px; background: #A9BC2B; color: #1F2604; text-align: center; font-size: 13px; font-weight: 700">People Developers<br><span style="font-weight: 500; font-size: 11px">in de lead</span></span>
                    <span style="position: absolute; left: 4%; bottom: 6px; width: 120px; padding: 8px; border-radius: 12px; background: #1B2A5C; color: #FFFFFF; text-align: center; font-size: 13px; font-weight: 700">T4K<br><span style="font-weight: 500; font-size: 11px">PM · SA · RTE</span></span>
                    <span style="position: absolute; right: 4%; bottom: 6px; width: 120px; padding: 8px; border-radius: 12px; background: #0072BC; color: #FFFFFF; text-align: center; font-size: 13px; font-weight: 700">HR<br><span style="font-weight: 500; font-size: 11px">P&amp;C, HRBP</span></span>
                  </div>
                </div>
              </div>
            </section>

            <section id="investeren" style="display: flex; flex-direction: column; gap: 14px">
              <h2 style="margin: 0; font-size: 28px; font-weight: 700; color: #1B2A5C">Opbouwen, bouwen en onderhouden</h2>
              <div style="display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: stretch">
                <div style="position: relative; min-height: 360px; padding: 10px 0">
                  <div style="position: absolute; left: 0; top: 10px; width: 58%; aspect-ratio: 1; max-height: 340px; border-radius: 50%; background: rgba(140,106,158,.20); border: 2px solid #8C6A9E"></div>
                  <div style="position: absolute; right: 0; top: 10px; width: 58%; aspect-ratio: 1; max-height: 340px; border-radius: 50%; background: rgba(0,166,160,.16); border: 2px solid #00A6A0"></div>
                  <div style="position: absolute; left: 6%; top: 60px; width: 36%; display: flex; flex-direction: column; gap: 8px">
                    <span style="font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #4A2A5C">Strategisch</span>
                    <sc-for list="{{pr.vennL}}" as="v" hint-placeholder-count="5"><span style="font-size: 13px; line-height: 1.35; font-weight: 600; color: #2E2238">{{v.text}}</span></sc-for>
                    <span style="font-size: 12px; font-style: italic; color: #4A2A5C">→ een sterk fundament vestigen</span>
                  </div>
                  <div style="position: absolute; right: 6%; top: 60px; width: 36%; display: flex; flex-direction: column; gap: 8px; text-align: right">
                    <span style="font-size: 13px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #00706D">Operationeel</span>
                    <sc-for list="{{pr.vennR}}" as="v" hint-placeholder-count="5"><span style="font-size: 13px; line-height: 1.35; font-weight: 600; color: #0E3533">{{v.text}}</span></sc-for>
                    <span style="font-size: 12px; font-style: italic; color: #00706D">de people runway bouwen en onderhouden ←</span>
                  </div>
