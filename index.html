ij helpen teams om AI effectief en verantwoord in te zetten om meer waarde te cre\xEBren."),null],pipeline:[h.pipeline,z("De Continuous Delivery Pipeline: van idee via exploratie, integratie en deployment naar release on demand.","Een snelle cyclus van Discover \u2192 Specify \u2192 Build \u2192 Validate \u2192 Release, waarin mensen en AI elke stap samen doen."),null],team:["Product \xB7 Builder(s) \xB7 Domain Expert","De kern van een AI-Native team: iemand die het product stuurt, builders die met AI-agents bouwen en een domeinexpert die de vakinhoud borgt.","Bij EDSN: de energiemarktkennis zit in de Domain Expert."],workitems:["Werkitems",z("Features, stories, spikes en enablers stromen door de iteraties.","Naast features en enablers: prototypes en experimenten \u2013 AI maakt snel valideren goedkoop."),null],pi:[h.pi,z("Het gezamenlijke planningsevent aan het begin van elke Program Increment.","Planning gericht op uitkomsten: welke effecten willen we deze PI bereiken?"),null],sense:[h.sense,z("Aan het eind van de PI: demo, meten en een gezamenlijke verbeterworkshop.","Doorlopend waarnemen en bijsturen op basis van data en feedback \u2013 niet pas aan het eind van de PI."),null],pioutcomes:[h.piOutcomes,"De resultaten per PI, gemeten tegen de afgesproken doelen.",null],gtm:["Go to Market","Het moment waarop de oplossing naar klanten gaat en daadwerkelijk waarde gaat leveren.",null],value:["Customer and Business Value","Businesswaarde is contextueel en veelzijdig: het is wat voor een organisatie het meest telt. Het stuurt beslissingen van strategie tot uitvoering. Wie scherp heeft wat waardevol is, kan die waarde ontdekken, erop sturen en meten op echte resultaten in plaats van output. En met elke release stapelt de waarde voor klant en organisatie zich verder op.",null],products:["Products and Solutions","De producten en oplossingen die de value streams opleveren.",null],customer:["Customer","Degene voor wie alle waarde wordt gecre\xEBerd.","Marktpartijen, netbeheerders en uiteindelijk de energieconsument."]},ks=i?[["f1","Mindset, Values, and Principles","De Lean-Agile mindset, waarden en principes, aangevuld voor werken met AI."],["f2","Outcome-Driven Development","Ontwikkelen gestuurd door meetbare uitkomsten in plaats van output."],["f3","SPCs and ASPCs","SAFe Practice Consultants en AI-SPC\u2019s die de transformatie leiden."],["f4","Implementation Roadmap","De stappen om AI-Native EDSN in te voeren."],["f5","LACE","Het Lean-Agile Center of Excellence: het team dat de transformatie aanjaagt, de werkwijze bewaakt en teams coacht."],["f6","Measure and Grow","Voortgang meten en gericht verbeteren."]]:[["f1","Lean-Agile Mindset","De basis: Lean-Agile denken, waarden en principes."],["f2","Customer Centricity","De klant centraal in elk besluit."],["f3","SPCs","SAFe Practice Consultants die de transformatie leiden."],["f4","Implementation Roadmap","De stappen om SAFe in te voeren."],["f5","LACE","Het Lean-Agile Center of Excellence: het team dat de transformatie aanjaagt, de werkwijze bewaakt en teams coacht."],["f6","Measure and Grow","Voortgang meten en gericht verbeteren."]],m1=[f,l,d,o,f,l];ks.forEach(([p,u,m])=>{be[p]=[u,m,null]});let h1=ks.map(([p,u],m)=>({label:u,dot:m1[m],pick:()=>e.setState({sel:p})})),dn={};Object.keys(be).forEach(p=>{dn[p]=()=>e.setState({sel:p})});let De={org:{g:"Organisatie",x:[["Wat is het?",z("Een Lean Enterprise organiseert zich rond waardestromen in plaats van afdelingen. Strategie, financiering en uitvoering zijn op elkaar aangesloten, zodat de organisatie snel kan inspelen op veranderingen.","Een AI-Native organisatie behandelt AI als vast onderdeel van het werk. Mensen en AI-agents werken samen in teams, en processen, rollen en governance zijn daarop ingericht.")],["Waarom is het belangrijk?","Het tempo van verandering in markt en technologie vraagt om een organisatie die snel kan leren en bijsturen. Losse verbeteringen in \xE9\xE9n team leveren weinig op als de rest van de organisatie op de oude manier blijft werken."],["Hoe ziet het eruit?",z("Kleine, autonome teams; gedecentraliseerde besluitvorming; financiering per waardestroom in plaats van per project; en leiders die het goede voorbeeld geven.","Teams waarin mensen sturen en agents het repetitieve werk versnellen, data als strategisch bezit, duidelijke kaders voor verantwoord AI-gebruik en leiders die zelf met AI experimenteren.")]],k:["Organiseer rond waardestromen, niet rond afdelingen",z("Strategie en uitvoering hangen direct samen","AI is onderdeel van het werk, geen los project"),"Leiderschap maakt of breekt de transformatie"],e:"EDSN vervult een centrale rol in de energieketen. De AI-Native manier van werken helpt om met dezelfde mensen meer ketenwaarde te leveren, terwijl betrouwbaarheid en zorgvuldigheid voorop blijven staan.",r:["portfolio","leadership","f1"]},portfolio:{g:"Portfolio",x:[["Wat is het?","Het portfolio is het niveau waarop strategie wordt vertaald naar investeringen. Hier wordt besloten welke waardestromen geld krijgen en welke grote initiatieven (epics) voorrang hebben."],["Lean Portfolio Management","In plaats van jaarlijkse projectbegrotingen werkt het portfolio met doorlopende financiering per waardestroom, een zichtbare backlog van epics en regelmatige herijking op basis van resultaten."],["Samenhang met de rest","Het portfolio geeft richting aan de ART\u2019s, en de ART\u2019s geven via hun resultaten weer feedback aan het portfolio. Zo ontstaat een gesloten lus tussen strategie en uitvoering."]],k:["Vertaalt strategie naar investeringen","Financiert waardestromen, geen projecten","Stuurt bij op basis van resultaten"],e:"Het CIO Office speelt een sleutelrol in het verbinden van strategie, architectuur en investeringskeuzes.",r:["leadership","backlog","valuestreams"]},leadership:{g:"Portfolio",x:[["Wat doet Portfolio Leadership?","Portfolio Leadership bepaalt de strategische richting, verdeelt budget over waardestromen en zorgt voor passende governance. Het is de groep die verantwoordelijk is voor de waarde van het hele portfolio."],["Verantwoordelijkheden","Het formuleren van strategische uitkomsten, het goedkeuren van epics, het bewaken van financi\xEBle kaders en het wegnemen van organisatorische belemmeringen voor de ART\u2019s."],["Leiderschapsstijl",z("Leiders werken volgens Lean-Agile principes: ze geven richting, maar laten de invulling over aan de teams.","In een AI-Native organisatie stimuleren leiders actief het experimenteren met AI, en bewaken ze tegelijk de ethische en juridische kaders.")]],k:["Bepaalt richting en budget","Bewaakt governance","Geeft het goede voorbeeld"],e:"",r:["outcomes","investment","governance"]},outcomes:{g:"Portfolio",x:[["Wat zijn het?",z("Strategische thema\u2019s zijn een beperkt aantal zakelijke doelen die de strategie verbinden met het portfolio. Ze sturen keuzes in de backlog.","Portfolio Outcomes zijn meetbare effecten die het portfolio wil bereiken. Ze beschrijven het gewenste resultaat, niet de oplossing.")],["Waarom sturen op uitkomsten?","Wie stuurt op output (opgeleverde features) weet nog niet of er waarde is gecre\xEBerd. Sturen op uitkomsten dwingt tot de vraag: wat verandert er voor de klant of de organisatie?"],["Hoe formuleer je ze?","Goede uitkomsten zijn specifiek, meetbaar en tijdgebonden. Koppel ze aan indicatoren die je regelmatig kunt meten, zodat je tijdig kunt bijsturen."]],k:["Uitkomst boven output","Meetbaar en tijdgebonden","Basis voor investeringskeuzes"],e:"Voorbeelden van uitkomsten: hogere datakwaliteit in de keten, kortere doorlooptijd van marktprocessen of meer flexibiliteit in het energiesysteem.",r:["investment","artoutcomes","roi"]},investment:{g:"Portfolio",x:[["Wat is het?","De investeringsstrategie bepaalt hoe het beschikbare budget wordt verdeeld over waardestromen en type werk, zoals nieuwe functionaliteit, platformen en onderhoud."],["Guardrails","Financi\xEBle guardrails geven teams ruimte om binnen afgesproken kaders zelf keuzes te maken. Grote afwijkingen worden expliciet besproken op portfolio-niveau."],["Periodiek herijken","De verdeling is niet voor een jaar vastgezet. Op vaste momenten wordt bekeken of de investeringen de gewenste uitkomsten opleveren en wordt de verdeling bijgesteld."]],k:["Budget per waardestroom","Guardrails geven ruimte","Regelmatig herijken"],e:"",r:["outcomes","roi","valuestreams"]},backlog:{g:"Portfolio",x:[["Wat is het?","De portfolio backlog bevat de epics die op portfolio-niveau zijn ge\xEFdentificeerd en geprioriteerd. Het is het hoogste niveau van de backlog-structuur."],["De Kanban-flow","Epics doorlopen een vaste flow: van idee via analyse en een Lean business case naar uitvoering. Zo blijft zichtbaar wat er speelt en wordt werk niet te vroeg gestart."],["Prioriteren","Prioriteren gebeurt op basis van economische waarde, tijdkritiek en risicoreductie. Het doel is de grootste waarde zo vroeg mogelijk te leveren."]],k:["Zichtbaar overzicht van grote initiatieven","Beperk werk in uitvoering","Prioriteer op economische waarde"],e:"",r:["epic","leadership","investment"]},epic:{g:"Portfolio",x:[["Wat is een epic?","Een epic is een omvangrijk initiatief dat een flinke investering vraagt en vaak meerdere ART\u2019s of PI\u2019s beslaat. Er hoort een Lean business case bij."],["Hypothese en MVP","Een epic wordt geformuleerd als hypothese. Met een Minimum Viable Product wordt getest of de verwachte waarde ontstaat, voordat er verder in wordt ge\xEFnvesteerd."],["Doorvertaling","Na goedkeuring wordt een epic opgesplitst in features voor de ART\u2019s. "+z("","AI helpt bij het snel uitwerken van varianten en het valideren van aannames.")]],k:["Groot initiatief met business case","Begint als hypothese","Wordt getest met een MVP"],e:"",r:["backlog","workitems","pm"]},valuestreams:{g:"Portfolio",x:[["Wat is een waardestroom?","Een waardestroom is de reeks stappen waarmee een organisatie waarde levert aan een klant, van het eerste verzoek tot de levering."],["Organiseren rond waarde","Teams en ART\u2019s worden zo ingericht dat ze een waardestroom zo zelfstandig mogelijk kunnen bedienen. Dat verkleint de afhankelijkheden en verkort de doorlooptijd."],["Operationeel en ontwikkeling","SAFe onderscheidt operationele waardestromen (hoe de klant waarde ontvangt) en ontwikkelwaardestromen (hoe we de systemen bouwen die dat mogelijk maken)."]],k:["Denk vanuit de klant","Minder afhankelijkheden","Basis voor de inrichting van ART\u2019s"],e:"Bij EDSN kun je denken aan de waardestromen rond de marktprocessen, de centrale registers en de ketenvoorzieningen voor de energiemarkt.",r:["platforms","art","customer"]},platforms:{g:"Portfolio",x:[["Wat zijn platformen?","Platformen zijn gedeelde technische en data-voorzieningen waar meerdere waardestromen gebruik van maken, zoals integratie-, data- en cloudplatformen."],["Waarom apart organiseren?","Door platformen als product te behandelen, met een eigen team en roadmap, kunnen waardestromen sneller bouwen zonder steeds hetzelfde wiel uit te vinden."],["Platformen en AI",z("Stabiele platformen zijn een voorwaarde voor continue levering.","AI-platformen leveren gedeelde modellen, agents, data en tooling, zodat teams AI veilig en consistent kunnen inzetten.")]],k:["Gedeelde voorzieningen","Behandel platformen als product","Versnellen alle waardestromen"],e:"Gedeelde data- en integratievoorzieningen zijn voor de energieketen een kritische basis.",r:["valuestreams","data","sa"]},roi:{g:"Portfolio",x:[["Wat is het?","Return on Investment is de waarde die investeringen opleveren ten opzichte van de kosten. In SAFe gaat het nadrukkelijk om meer dan financieel rendement."],["Breder dan geld","Waarde kan ook bestaan uit maatschappelijk effect, risicoreductie, klanttevredenheid of een betere positie voor de toekomst."],["Meten en bijsturen","Door uitkomsten regelmatig te meten kan het portfolio vroeg zien of een investering rendeert, en tijdig stoppen of opschalen."]],k:["Waarde ten opzichte van kosten","Ook maatschappelijke waarde telt","Meet vroeg en vaak"],e:"Als maatschappelijk geori\xEBnteerde organisatie meet EDSN waarde ook in betrouwbaarheid en maatschappelijk effect voor de energietransitie.",r:["outcomes","investment","value"]},governance:{g:"Portfolio",x:[["Wat is het?","AI Governance and Ethics omvat de kaders, afspraken en controles die zorgen dat AI verantwoord wordt ingezet, over het hele portfolio heen."],["Belangrijke thema\u2019s","Transparantie en uitlegbaarheid, privacy en gegevensbescherming, beveiliging, eerlijkheid van modellen, menselijk toezicht en naleving van wet- en regelgeving zoals de EU AI Act."],["Governance die niet remt","Goede governance is ingebed in de manier van werken: duidelijke richtlijnen, herbruikbare controles en snelle beoordelingen, zodat teams veilig kunnen versnellen."]],k:["Verantwoord en uitlegbaar","Mens blijft eindverantwoordelijk","Ingebed in het werk, niet erachteraan"],e:"Door de maatschappelijke rol en de gevoeligheid van energiedata is zorgvuldige AI-governance voor EDSN extra belangrijk.",r:["leadership","data","sa"]},owners:{g:"Agile Release Train",x:[["Wie zijn het?","Business Owners zijn de belangrijkste stakeholders van een ART. Zij zijn verantwoordelijk voor de bedrijfswaarde die de ART levert."],["Wat doen ze?","Ze nemen deel aan de PI-planning, kennen business value toe aan doelen, beoordelen de resultaten en helpen belemmeringen weg te nemen."],["Waarom zijn ze belangrijk?","Zonder actieve betrokkenheid van de business ontstaat het risico dat de ART de verkeerde dingen bouwt. Business Owners zorgen voor focus op waarde."]],k:["Eigenaar van de bedrijfswaarde","Actief in PI-planning","Helpen belemmeringen opruimen"],e:"",r:["art","pi","artoutcomes"]},art:{g:"Agile Release Train",x:[["Wat is een ART?",z("Een Agile Release Train is een langdurig team van agile teams, meestal 50 tot 125 mensen, dat samen een oplossing ontwikkelt en levert.","Een AI-Native ART is een team van teams waarin mensen en AI-agents samenwerken. Doordat agents een deel van het werk overnemen, kunnen teams kleiner zijn en sneller leveren.")],["Gezamenlijke cadans","Alle teams in de ART werken op hetzelfde ritme: ze plannen samen, integreren regelmatig en demonstreren samen het resultaat."],["De kernrollen","Product Management bepaalt wat er gebouwd wordt, de System Architect bewaakt de technische richting, de RTE faciliteert het proces en de People Developer zorgt voor de groei van de mensen."]],k:["Team van teams rond een waardestroom","E\xE9n ritme, \xE9\xE9n plan",z("Langdurig en stabiel","Mensen en agents werken samen")],e:"",r:["pm","rte","peopledev","teams"]},pm:{g:"Agile Release Train",x:[["Wat doet Product Management?","Product Management is verantwoordelijk voor wat de ART bouwt. Ze vertalen klantbehoeften en strategie naar een visie, roadmap en geprioriteerde features."],["Visie en roadmap","Een sterke productvisie is gebaseerd op klantinzicht, sluit aan op de strategie en is technisch haalbaar. De roadmap laat zien welke uitkomsten wanneer worden nagestreefd."],["Met AI",z("Product Management werkt nauw samen met klanten en Business Owners om waarde te valideren.","AI helpt Product Management bij het analyseren van klantfeedback en marktdata en bij het snel toetsen van idee\xEBn met prototypes.")]],k:["Eigenaar van het wat","Bewaakt visie en roadmap","Prioriteert op waarde"],e:"",r:["vision","roadmap","sa"]},sa:{g:"Agile Release Train",x:[["Wat doet de System Architect?","De System Architect geeft technische richting aan de ART. Die zorgt dat de oplossing schaalbaar, veilig en onderhoudbaar blijft."],["Architectural runway","De architect zorgt voor voldoende technische basis om toekomstige features te kunnen bouwen, zonder te veel vooruit te ontwerpen."],["AI in de architectuur",z("De architect werkt samen met teams en enterprise architecture om keuzes af te stemmen.","In een AI-Native ART ontwerpt de architect ook hoe agents, modellen en data veilig in de oplossing worden opgenomen.")]],k:["Technische richting","Bouwt aan de runway","Afstemming met enterprise architecture"],e:"Afstemming met de enterprise architectuur en ketenarchitectuur is voor EDSN essentieel.",r:["platforms","pm","governance"]},rte:{g:"Agile Release Train",x:[["Wat doet de RTE?","De Release Train Engineer is de dienend leider en coach van de ART. De RTE faciliteert de events en processen en helpt de trein soepel te laten lopen."],["Verantwoordelijkheden","Het organiseren van de PI-planning, het bewaken van risico\u2019s en afhankelijkheden, het escaleren van belemmeringen en het stimuleren van continue verbetering."],["Samenwerking","De RTE werkt nauw samen met Product Management, de System Architect, de People Developer en de coaches van de teams."]],k:["Dienend leider van de ART","Faciliteert de events","Ruimt belemmeringen op"],e:"",r:["pi","sense","architects"]},peopledev:{g:"Agile Release Train",x:[["Wat doet de People Developer?","De People Developer is de leidinggevende die zich richt op de mensen in de ART: hun ontwikkeling, loopbaan, vaardigheden en welzijn."],["Waarom deze rol?","In agile organisaties ligt de inhoudelijke sturing bij de teams en de ART. Daardoor ontstaat ruimte voor een leidinggevende die zich volledig op de groei van mensen kan richten."],["Ontwikkeling in een AI-Native wereld",z("De People Developer helpt medewerkers groeien in hun vak en in agile werken.","Met AI veranderen rollen en vaardigheden snel. De People Developer helpt medewerkers nieuwe AI-vaardigheden te ontwikkelen en hun rol opnieuw vorm te geven.")]],k:["Richt zich op de mensen","Coacht op groei en loopbaan","Verbindt lijn en ART"],e:"De People Developer verbindt de lijnorganisatie met de ART en helpt medewerkers bij de overgang naar nieuwe manieren van werken.",r:["rte","art","f1"]},vision:{g:"Agile Release Train",x:[["Wat is een productvisie?","De visie beschrijft het toekomstbeeld van de oplossing: welk probleem lossen we op, voor wie en waarom is dat belangrijk."],["Kenmerken van een sterke visie","Een goede visie is gebaseerd op klant- en marktinzicht, sluit aan op de strategie van het portfolio en is verankerd in wat technisch haalbaar is."],["De visie levend houden","Deel de visie steeds opnieuw: bij PI-planning, in demo\u2019s en in de dagelijkse tools. Gebruik feedback om haar bij te stellen."]],k:["Geeft richting en inspiratie","Gebaseerd op data en strategie","Steeds opnieuw delen"],e:"",r:["roadmap","pm","intent"]},artoutcomes:{g:"Agile Release Train",x:[["Wat zijn het?",z("PI Objectives beschrijven wat de ART in een PI wil bereiken. Business Owners kennen er business value aan toe.","ART Outcomes beschrijven de effecten die de ART wil bereiken voor klant en organisatie, afgeleid van de portfolio-uitkomsten.")],["Van portfolio naar team","Uitkomsten vormen een keten: portfolio-uitkomsten worden vertaald naar ART-uitkomsten, en die weer naar teamuitkomsten. Zo werkt iedereen aan hetzelfde doel."],["Meten","Elke uitkomst krijgt indicatoren die tijdens de PI worden gevolgd, zodat de ART kan bijsturen."]],k:["Afgeleid van de portfolio-uitkomsten","Concreet en meetbaar","Basis voor PI-planning"],e:"",r:["outcomes","teamoutcomes","pioutcomes"]},intent:{g:"Agile Release Train",x:[["Wat is het?",z("De visie, roadmap en context vormen samen de input voor de ART: waar werken we naartoe en binnen welke kaders?","Intentie, specificaties en context beschrijven wat we willen bereiken, aan welke eisen de oplossing moet voldoen en in welke omgeving ze werkt.")],["Waarom is dit zo belangrijk?",z("Een gedeeld beeld voorkomt misverstanden en dubbel werk.","AI-agents zijn zo goed als de context die ze krijgen. Goed vastgelegde intentie en specificaties zijn daarom een waardevol bezit: ze sturen de agents die meebouwen.")],["In de praktijk","Leg doelen, eisen, architectuurkeuzes en domeinkennis vast op een plek die voor mensen \xE9n tools toegankelijk is, en houd ze actueel."]],k:["Gedeeld beeld van het doel",z("Voorkomt misverstanden","Context stuurt de AI"),"Vastleggen en actueel houden"],e:"De diepe domeinkennis over de energiemarkt is precies het soort context dat het verschil maakt.",r:["vision","data","pipeline"]},roadmap:{g:"Agile Release Train",x:[["Wat is een roadmap?","De roadmap laat zien welke resultaten en mijlpalen de ART de komende PI\u2019s verwacht te leveren."],["Uitkomstgericht","Een moderne roadmap beschrijft vooral welke uitkomsten we nastreven, niet alleen welke features er komen. Zo blijft er ruimte voor de beste oplossing."],["Vooruitkijken met mate","De eerstvolgende PI is redelijk concreet; verder vooruit is de roadmap een prognose die regelmatig wordt bijgesteld."]],k:["Toont richting in de tijd","Uitkomstgericht","Hoe verder weg, hoe globaler"],e:"",r:["vision","pm","pi"]},data:{g:"Team",x:[["Wat is het?","Gecureerde data is data die is geselecteerd, opgeschoond en gedocumenteerd, zodat AI-modellen en agents er betrouwbaar mee kunnen werken."],["Waarom het fundament?","De kwaliteit van AI-uitkomsten hangt direct af van de kwaliteit van de data. Slechte data leidt tot slechte beslissingen, hoe goed het model ook is."],["Data als product","Behandel belangrijke datasets als producten, met een eigenaar, kwaliteitsafspraken en duidelijke toegangsregels."]],k:["Kwaliteit boven kwantiteit","Data als product","Toegang volgens duidelijke regels"],e:"Als beheerder van centrale ketendata heeft EDSN een unieke positie: datakwaliteit is hier tegelijk randvoorwaarde en waardepropositie.",r:["governance","platforms","intent"]},teams:{g:"Team",x:[["Wat zijn het?",z("Agile teams zijn cross-functionele teams van 5 tot 11 mensen die zelfstandig waarde kunnen defini\xEBren, bouwen en testen.","AI-Native teams zijn kleine teams waarin mensen en AI-agents samenwerken. Mensen bepalen de richting, beoordelen het resultaat en nemen besluiten.")],["Hoe werken ze?",z("Teams werken in korte iteraties met Scrum of Kanban en leveren regelmatig werkende software op.","Agents nemen werk over zoals code schrijven, testen en documenteren. Daardoor verschuift het werk van mensen naar specificeren, beoordelen en verbeteren.")],["Samenstelling",z("Een team heeft een Product Owner, een Scrum Master of Team Coach en ontwikkelaars.","Een typisch AI-Native team bestaat uit iemand voor het product, een of meer builders en een domeinexpert, aangevuld met agents.")]],k:["Klein en cross-functioneel",z("Leveren in korte iteraties","Mens stuurt, agent versnelt"),"Onderdeel van een ART"],e:"",r:["team","architects","teamoutcomes"]},teamoutcomes:{g:"Team",x:[["Wat zijn het?","Teamuitkomsten beschrijven wat een team in een periode wil bereiken, afgeleid van de uitkomsten van de ART."],["Eigenaarschap","Het team formuleert zijn uitkomsten zelf tijdens de planning. Dat zorgt voor betrokkenheid en een realistisch plan."],["Zichtbaar maken","Door de uitkomsten zichtbaar te houden en regelmatig te meten weet het team of het op koers ligt."]],k:["Afgeleid van de ART-uitkomsten","Door het team zelf opgesteld","Regelmatig gemeten"],e:"",r:["artoutcomes","teams","pi"]},architects:{g:"Team",x:[["Wie zijn het?",z("Scrum Masters en Team Coaches helpen teams om effectief samen te werken, flow te verbeteren en continu te leren.","AI Value Architects zijn een doorontwikkeling van Scrum Masters, Team Coaches en SPC\u2019s. Ze helpen teams en ART\u2019s om AI effectief en verantwoord in te zetten.")],["Wat doen ze?",z("Ze faciliteren events, coachen het team en helpen belemmeringen op te ruimen.","Ze zoeken waar AI de meeste waarde oplevert, helpen werkwijzen aan te passen, delen goede voorbeelden en bewaken de kaders voor verantwoord gebruik.")],["Benodigde vaardigheden","Coaching en facilitatie, kennis van Lean-Agile werken"+z("."," en praktische ervaring met AI-tools en agents.")]],k:["Coach van teams",z("Verbetert flow","Vertaalt AI naar waarde"),"Verbindt teams en ART"],e:"",r:["teams","rte","f3"]},pipeline:{g:"Team",x:[["Wat is het?",z("De Continuous Delivery Pipeline beschrijft de stappen om een idee om te zetten in waarde: Continuous Exploration, Integration, Deployment en Release on Demand.","De AI Innovation Pipeline is een snelle cyclus van Discover, Specify, Build, Validate en Release, waarin mensen en AI elke stap samen doorlopen.")],["De stappen",z("Exploratie zoekt naar waarde, integratie bouwt en test, deployment brengt naar productie en de release maakt het beschikbaar wanneer de business dat wil.","Discover zoekt naar kansen, Specify legt intentie en eisen vast, Build bouwt met behulp van agents, Validate toetst of het werkt en waarde levert, en Release brengt het naar de klant.")],["Snelheid en kwaliteit","Automatisering en kleine stappen maken het mogelijk om vaak en met weinig risico te leveren. "+z("","AI verkort vooral de tijd tussen idee en werkend prototype.")]],k:["Van idee naar waarde","Kleine stappen, vaak leveren",z("Automatiseer waar het kan","Mens en AI in elke stap")],e:"",r:["intent","workitems","gtm"]},team:{g:"Team",x:[["De samenstelling","Het AI-Native team draait om drie rollen: Product, Builder(s) en Domain Expert, ondersteund door AI-agents."],["De rollen","Product bepaalt wat waardevol is en stelt prioriteiten. Builders specificeren, bouwen en testen samen met agents. De Domain Expert brengt vakkennis in en beoordeelt of de oplossing klopt."],["Waarom zo klein?","Omdat agents een groot deel van het uitvoerende werk versnellen, kan een klein team veel bereiken. Communicatie blijft eenvoudig en besluiten worden snel genomen."]],k:["Product, Builder(s), Domain Expert","Klein team, grote impact","Agents versterken, mensen beslissen"],e:"Bij EDSN is de Domain Expert de plek waar de kennis van energiemarkt, regelgeving en ketenprocessen samenkomt.",r:["teams","pipeline","data"]},workitems:{g:"Team",x:[["Soorten werk",z("Features beschrijven functionaliteit voor de gebruiker, stories zijn kleine stukken werk voor \xE9\xE9n iteratie, spikes zijn onderzoek en enablers bouwen aan de technische basis.","Naast features en enablers spelen prototypes en experimenten een grote rol. AI maakt het goedkoop om idee\xEBn snel te testen.")],["Iteraties","Het werk wordt opgepakt in korte iteraties, met aan het eind een werkend en getest resultaat."],["Balans","Zorg voor een gezonde balans tussen nieuwe functionaliteit, technische basis en onderhoud, zodat de snelheid op lange termijn behouden blijft."]],k:["Verschillende soorten werk",z("Klein en afgerond per iteratie","Experimenteer goedkoop"),"Balans tussen nieuw en basis"],e:"",r:["epic","pipeline","pi"]},pi:{g:"Cadans",x:[["Wat is het?",z("PI Planning is het gezamenlijke planningsevent aan het begin van elk Program Increment, waarin alle teams van de ART samen plannen.","PI Outcome Planning is de gezamenlijke planning aan het begin van elk PI, met de nadruk op de uitkomsten die de ART wil bereiken.")],["Hoe verloopt het?","De business deelt de context en visie, teams maken hun plannen, afhankelijkheden en risico\u2019s worden zichtbaar gemaakt en aan het eind committeert de ART zich aan het plan."],["Waarom werkt het?","Iedereen tegelijk in \xE9\xE9n ruimte (fysiek of online) zorgt voor afstemming in twee dagen die anders weken zou kosten."]],k:["Iedereen plant samen","Afhankelijkheden worden zichtbaar",z("Commitment aan PI Objectives","Focus op uitkomsten")],e:"",r:["sense","pioutcomes","rte"]},sense:{g:"Cadans",x:[["Wat is het?",z("Inspect and Adapt is het event aan het eind van een PI: een demo, een meting van de resultaten en een gezamenlijke verbeterworkshop.","Sense and Respond is doorlopend waarnemen en bijsturen op basis van data en feedback, gedurende het hele PI.")],["Hoe werkt het?",z("De ART laat zien wat er is bereikt, analyseert wat beter kan en spreekt concrete verbeteringen af.","Teams en de ART volgen hun indicatoren continu. Wijken de resultaten af, dan wordt meteen bijgestuurd in plaats van te wachten tot het eind van het PI.")],["Leercultuur","Het doel is niet om schuldigen te vinden, maar om als systeem te leren en elke PI een beetje beter te worden."]],k:[z("Demo, meten en verbeteren","Continu meten"),"Snel bijsturen","Leren als systeem"],e:"",r:["pi","pioutcomes","f6"]},pioutcomes:{g:"Cadans",x:[["Wat zijn het?","De resultaten die de ART in een PI heeft bereikt, gemeten tegen de doelen en uitkomsten die bij de planning zijn afgesproken."],["Hoe meet je?","Business Owners beoordelen de geleverde waarde. Daarnaast worden de afgesproken indicatoren gemeten."],["Gebruik","De resultaten voeden de volgende planning en laten het portfolio zien of de investering effect heeft."]],k:["Resultaat per PI","Gemeten tegen afspraken","Input voor de volgende PI"],e:"",r:["artoutcomes","pi","roi"]},gtm:{g:"Waarde",x:[["Wat is het?","Go to Market is het moment waarop een oplossing daadwerkelijk bij klanten terechtkomt en waarde begint te leveren."],["Release on demand","Bouwen en uitrollen zijn losgekoppeld van het moment van vrijgeven. De business bepaalt wanneer een release naar de markt gaat."],["Voorbereiding","Denk aan communicatie, training, ondersteuning en het meten van het gebruik na de lancering."]],k:["Van opgeleverd naar in gebruik","De business bepaalt het moment","Meet het effect"],e:"In de energieketen vraagt elke release om zorgvuldige afstemming met marktpartijen en netbeheerders.",r:["pipeline","products","customer"]},value:{g:"Waarde",x:[["Waarom businesswaarde?","Elke organisatie heeft unieke sterktes. Door helder te maken wat het meest waardevol is, kan iedereen daar gericht aan bijdragen. Businesswaarde stuurt beslissingen op elk niveau."],["Niet alleen voor de top","Een veelgehoorde gedachte is dat waarde iets is voor het senior management. Maar echte wendbaarheid vraagt om decentrale besluiten. Daarom moet iedereen, van portfolio tot team, begrijpen wat waarde is in zijn of haar context."],["Vroeg en vaak","Door in kleine stappen te leveren begint de waarde eerder en kan de koers worden bijgesteld op basis van echte feedback. Met elke release stapelt de waarde zich op."]],k:["Begrip van businesswaarde is de basis voor succes","Business value discovery brengt prioriteiten op \xE9\xE9n lijn","Meet waarde op resultaat, niet op output","Maak waarde onderdeel van elk gesprek en elke beslissing"],e:"Voor EDSN is waarde breder dan financieel: betrouwbare ketenvoorzieningen, datakwaliteit en een bijdrage aan de energietransitie tellen net zo zwaar.",r:["outcomes","roi","f2","customer"]},products:{g:"Waarde",x:[["Wat zijn het?","De producten en oplossingen die de waardestromen opleveren en die klanten gebruiken."],["Productdenken","Een product heeft een eigenaar, een visie en een levenscyclus. Het wordt continu verbeterd op basis van gebruik en feedback."],["Samenhang","Grote oplossingen bestaan vaak uit meerdere producten en platformen die samen waarde leveren."]],k:["Wat de klant gebruikt","Continu verbeterd","Eigenaar en visie per product"],e:"",r:["valuestreams","customer","pm"]},customer:{g:"Waarde",x:[["Wie is de klant?","De klant is degene voor wie alle waarde wordt gecre\xEBerd. Klantgerichtheid is het uitgangspunt van elke beslissing."],["Klantinzicht","Gebruik onderzoek, data en directe feedback om te begrijpen wat de klant echt nodig heeft. "+z("","AI helpt om grote hoeveelheden feedback snel te analyseren.")],["Betrek de klant","Laat klanten meedenken, testen en beoordelen, zodat de oplossing aansluit op hun praktijk."]],k:["Startpunt van alles","Begrijp de echte behoefte","Betrek de klant vroeg"],e:"De klanten van EDSN zijn onder meer marktpartijen en netbeheerders, en via hen uiteindelijk de energieconsument.",r:["value","products","f2"]}},x1={f1:[["De basis","Een Lean-Agile mindset, gedeelde waarden en principes vormen het fundament onder alle rollen en events."],["Waarom?","Zonder de juiste mindset blijven nieuwe rollen en events een vorm zonder inhoud."],["In de praktijk","Leiders en teams laten de principes zien in hun keuzes: denken in systemen, decentraal beslissen en sturen op flow."]],f2:[["De kern",z("Klantgerichtheid betekent dat elke keuze begint bij de klant en diens behoefte.","Outcome-Driven Development betekent dat werk wordt gestuurd door meetbare uitkomsten in plaats van door opgeleverde output.")],["Waarom?","Zo voorkom je dat er veel wordt gebouwd dat weinig waarde oplevert."],["In de praktijk","Formuleer uitkomsten, meet ze en stuur bij op basis van de resultaten."]],f3:[["Wie zijn het?",z("SAFe Practice Consultants begeleiden en trainen de organisatie bij de invoering van SAFe.","SPC\u2019s en AI-SPC\u2019s begeleiden de organisatie bij de invoering van AI-Native werken.")],["Wat doen ze?","Ze trainen leiders en teams, coachen bij de eerste ART\u2019s en helpen de werkwijze verder te verbeteren."],["Interne capaciteit","Door eigen mensen op te leiden blijft de kennis in de organisatie."]],f4:[["Wat is het?","Een stappenplan voor de invoering, van het cre\xEBren van urgentie tot het lanceren en verbeteren van ART\u2019s."],["Hoe gebruik je het?","Als leidraad, niet als dwingend recept: de stappen worden afgestemd op de situatie."],["Klein beginnen","Start met \xE9\xE9n waardestroom of ART, leer en breid daarna uit."]],f5:[["Wat is het?","LACE staat voor Lean-Agile Center of Excellence: een klein, toegewijd team dat de transformatie naar de nieuwe manier van werken aanjaagt en ondersteunt."],["Wat doet het LACE?","Het LACE ontwikkelt en bewaakt de werkwijze, coacht leiders, RTE\u2019s en teams, organiseert trainingen en communities of practice, en zorgt dat goede voorbeelden worden gedeeld."],["Samenwerking","Het LACE werkt nauw samen met de RTE\u2019s en het T4K aan werkwijze en coaching, en met de SPC\u2019s aan training en begeleiding."+z(""," In een AI-Native organisatie helpt het LACE ook bij het verspreiden van verantwoorde AI-praktijken.")]],f6:[["Wat is het?","Meten hoe goed de organisatie presteert op uitkomsten, flow en vaardigheden, en daar gericht op verbeteren."],["Wat meet je?","Uitkomsten (levert het waarde?), flow (hoe snel en voorspelbaar?) en competenties (hoe goed zijn we erin?)."],["Groeien","Gebruik de metingen om verbeteringen te kiezen, niet om teams af te rekenen."]]};ks.forEach(([p])=>{De[p]={g:"Fundament",x:x1[p],k:["Onderdeel van het fundament","Ondersteunt alle niveaus","Klein beginnen, continu verbeteren"],e:"",r:["org","f4","f6"]}});let sc={pm:["#0E5F96","#E6EFF6","Waarde"],sa:["#00807E","#E0F2F1","Techniek"],rte:["#3B7898","#E6EFF4","Flow"],peopledev:["#5E6E0C","#F1F4DC","Mensen"]},ea={pm:{abbr:"PM",full:"Product Manager",kern:"De PM bepaalt productrichting en prioriteiten op basis van klantwaarde.",intro:"Verbindt klantbehoeften aan bedrijfsdoelen en draagt met het T4K het resultaat van idee tot operatie.",wheel:["Productrichting","Backlog en roadmap","Waarde en kosten","Dienstverlening en continu\xEFteit","Go-Live en risico"],doelen:["Productvisie en roadmap geven richting aan de ART.","Een geprioriteerde backlog maximaliseert klantwaarde.","Features sluiten aan op strategie, markt en klantfeedback.","Stakeholders en teams werken aan continue waarde."],ai:["Weegt AI vanaf de start mee in productkeuzes.","Toetst klantwaarde met kleine experimenten en echte feedback."],resp:[["Productrichting","Klantvraag, productvisie, dienstenafbakening en meetbare doelen bepalen.","Productvisie en doelen"],["Backlog en roadmap","Features prioriteren met POs en stakeholders. Run, Change, enablers en lifecyclewerk afwegen met SA en RTE.","ART-backlog en roadmap"],["Waarde en kosten","TCO, investeringen en FinOps afwegen. AI-use-cases op waarde prioriteren.","Waarde- en kostenafweging"],["Dienstverlening en continu\xEFteit","Diensten en dienstniveaus afstemmen met SA. Kritikaliteit, businessimpact en RTO/RPO bepalen met betrokken rollen.","Dienstniveaus en RTO/RPO"],["Go-Live en risico","Functionele en ketenacceptatie onderbouwen en readiness meewegen. Risico-advies voorbereiden voor de bevoegde eigenaar.","Acceptatie- en risico-advies"]],meet:[["Klantwaarde","Klantfeedback, featurewaarde en adoptie"],["Levering","Time-to-market en PI-doelrealisatie"],["Richting","Backloggezondheid en stakeholderafstemming"],["Vernieuwing","Innovatie en verbeterinitiatieven"]],afst:"Portfolio Sync en System Demos",samen:[["Klanten en Business Owners","Klantvraag en bedrijfsdoelen"],["SA, RTE en PD","Integrale T4K-afstemming"],["POs en teams","Productrichting en prioriteiten"],["Portfolio / PMT","Kaders en roadmapafstemming"]],mandaat:"POs beheren hun teambacklog. De bevoegde risico-eigenaar accepteert restrisico.",kpi:["Klanttevredenheid en -feedback","Time-to-market (T2M)","Waarde van geleverde features","Backloggezondheid","Stakeholder alignment","PI-doelrealisatie","Innovatie en verbeterinitiatieven","Adoptie van productfeatures door eindgebruikers"],relatie:["Werkt samen met POs, SA, RTE, PD, klanten en Business Owners binnen het T4K.","Geeft productrichting en prioriteiten mee aan POs. POs beheren hun teambacklog.","Stemt businessdoelen af met Business Owners/PMT en werkt binnen portfoliokaders.","Neemt deel aan Portfolio Sync en System Demos. Verbindt klantfeedback aan de roadmap."],ontw:["Groei naar strategische rollen zoals Solution Manager of Epic Owner.","Verdieping in marktanalyse, business strategy of lean portfolio management.","Leiderschapstraining, coaching en innovatieprogramma\u2019s."],strat:"De Product Manager is een sleutelfiguur in het leveren van klantwaarde op schaal. Door strategisch inzicht te combineren met klantgerichtheid en teamalignment, zorgt de PM voor een goed gevulde en goed geprioriteerde backlog. Daarmee versnelt hij of zij de time-to-market, stimuleert innovatie en borgt alignment met bedrijfsdoelen.",bijdrage:"Productvisie, roadmap en klantwaarde",t4kAfst:"Met POs, klanten en Business Owners"},rte:{abbr:"RTE",full:"Release Train Engineer",kern:"De RTE verbetert flow en maakt levering en gereedheid voorspelbaar.",intro:"Faciliteert en coacht de ART. Verbindt met het T4K de uitvoering aan Run en beheerste ingebruikname.",wheel:["Planning en capaciteit","Flow en afhankelijkheden","Run en Go-Live", dviseren.","Herstelontwerp en readiness-advies"],["FinOps en AI","Cost drivers en lifecyclekosten inzichtelijk maken. AI-guardrails borgen en met PD technische kennis ontwikkelen.","Cost drivers en AI-guardrails"]],meet:[["Runway en vernieuwing","Coverage en time-to-market van enablers"],["Kwaliteit","Technische schuld en standaarden"],["Betrouwbaarheid","Performance, integraties en hergebruik"],["Afstemming","Enterprise-alignment en stakeholdertevredenheid"]],afst:"Architect Syncs, System Demos, I&A en PI Planning",samen:[["Enterprise Architecture","Enterprise-kaders en samenhang"],["PM, RTE en PD","T4K-doelen en technische keuzes"],["Tech Leads, POs en teams","Ontwerp en realisatie"],["Risk en centrale disciplines","CISO, Privacy en IT Resilience"]],mandaat:"EA en centrale disciplines bepalen enterprise-kaders. Teams ontwerpen en realiseren daarbinnen. Afwijkingen volgen de bevoegde governance.",kpi:["Architectural runway coverage","Technische schuldreductie en naleving van kwaliteitsstandaarden","System reliability & performance metrics","Alignment met enterprise-architectuurprincipes","Aantal succesvolle systeemintegraties en PI-demo-resultaten","Time-to-market van enabler-features","Mate van re-use van architecturale componenten","Stakeholdertevredenheid (Product Management, RTE, teams, Enterprise Architecture)"],relatie:["Werkt binnen het T4K samen met PM, RTE en PD en ondersteunt POs, Tech Leads en teams.","Stemt architectuur en ketenafhankelijkheden af met andere System Architects en EA.","EA en centrale disciplines bepalen enterprise-kaders. Teams ontwerpen en realiseren daarbinnen.","Risk, CISO, Privacy en IT Resilience leveren kaders en toetsing. SA onderbouwt technische naleving.","Neemt deel aan Architect Syncs, System Demos, Inspect & Adapt en PI Planning."],ontw:["Groei naar Solution Architect of Enterprise Architect-rol.","Verdieping in cloud-, data- of security-architecturen.","Verbreding richting tech leadership of architectural governance.","Deelname aan innovation tracks, AI-integratie en design thinking-programma\u2019s.","Coachingvaardigheden versterken om teams te ondersteunen in technische groei."],strat:"De System Architect vormt de technische ruggengraat van de ART. Door strategisch inzicht te combineren met pragmatische technische keuzes zorgt hij of zij dat de oplossing duurzaam kan groeien en in lijn blijft met enterprise-doelen. De System Architect versnelt innovatie, vermindert risico\u2019s en maakt schaalbare klantwaarde mogelijk door een heldere architecturale koers te bewaken.",bijdrage:"Architectuur, kwaliteit en herstelbaarheid",t4kAfst:"Met teams, EA en centrale disciplines"}};De.f5.k=["Aanjager van de transformatie","Bewaakt en verbetert de werkwijze","Coacht leiders, RTE\u2019s en teams"],De.f5.r=["rte","t4k","f3"],i&&(be.f2=["Outcome-Driven Development","Bij outcome-driven development sturen we niet op hoeveel we opleveren, maar op wat het oplevert. Uitkomsten leggen we vast op portfolio-, ART-, PI- en teamniveau, en met metingen toetsen we steeds of ons werk die uitkomsten echt dichterbij brengt.",null],De.f2={g:"Fundament",x:[["Van output naar uitkomst","Output is wat we maken: features, releases, rapportages. Een uitkomst is de verandering die dat teweegbrengt bij klant of organisatie, zoals een kortere doorlooptijd, minder fouten in de keten of een hogere tevredenheid. Werk telt pas echt als het bijdraagt aan zo\u2019n uitkomst."],["Waarom juist nu?","Met AI wordt bouwen sneller en goedkoper. Daardoor is het opleveren van features op zichzelf geen onderscheidend vermogen meer. Sterker nog: een stroom aan slecht afgestemde features kan de klantervaring juist verslechteren. Richting geven op uitkomsten wordt daarmee belangrijker dan ooit."],["De outcome-driven cyclus","De cyclus verbindt vijf elementen. Uitkomsten maken de strategische bedoeling expliciet. Prioriteren bepaalt waarin we investeren. Output is het werk dat we leveren, maar telt pas als het uitkomsten oplevert. Metrics laten zien hoe die output presteert. En klant- en bedrijfswaarde maken het resultaat concreet. Korte feedbackloops laten zien of we het werk of de doelen moeten bijstellen."],["Op elk niveau","De cyclus werkt op portfolio-, ART- en teamniveau, elk met een eigen rol. Het portfolio bepaalt de strategische uitkomsten en investeringen, de ART vertaalt die naar uitkomsten per PI, en teams kiezen hun eigen uitkomsten die daaraan bijdragen."],["De outcome tree","Een outcome tree, opgebouwd met OKR\u2019s (Objectives and Key Results), verbindt de strategie van het portfolio met het dagelijkse werk van teams. Zo ziet iedereen hoe het eigen werk bijdraagt aan het grotere doel, en blijft de samenhang zichtbaar als prioriteiten verschuiven."],["Moonshots en roofshots","Niet elke uitkomst heeft hetzelfde ambitieniveau. Roofshots zijn uitdagende maar haalbare doelen waar we op rekenen. Moonshots zijn bewust zeer ambitieus: ook gedeeltelijk succes levert dan veel op. Door uitkomsten zo te typeren balanceren teams tussen voorspelbaarheid en innovatie."]],cmp:[["Focus","Vooraf bepaalde features opleveren","Resultaat voor klant of organisatie"],["Meten","Flow-metrics en releasedatums","Impact, behoud, klantwaarde en rendement"],["Roadmap","Lijst van features met datums","Uitkomsten die we willen bereiken"],["Wanneer klaar?","Als de feature is opgeleverd","Als de beoogde uitkomst is bereikt"]],k:["Stuur op uitkomst, niet op output","Toets met snelle feedbackloops","Een outcome tree verbindt strategie en teamwerk","Balanceer roofshots en moonshots"],e:"Voor EDSN betekent dit: niet tellen hoeveel wijzigingen we in de keten doorvoeren, maar meten wat ze opleveren voor marktpartijen, netbeheerders en het energiesysteem.",r:["outcomes","artoutcomes","sense"]}),be.sp=["Uitgangspunten story points","Door story points te normaliseren ontstaat \xE9\xE9n gedeeld referentiekader voor alle teams in de ART. Teams blijven zelf inschatten, maar op basis van dezelfde kalibratie. Zo wordt velocity beter
